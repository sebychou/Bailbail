  const [vc,vt]=verdict();
  const arts=[...new Set(S.arts.join(', ').split(/,\s*/).map(a=>a.trim()))].filter(a=>/^CO|^\d/.test(a)).map(a=>a.replace(/^CO\s*/,'')).filter(Boolean);
  const artNums=[...new Set(arts.flatMap(a=>a.split(/[–-]/).length===2&&/^\d/.test(a)?[a]:[a]))].sort((a,b)=>parseFloat(a)-parseFloat(b)||a.localeCompare(b));
  card.innerHTML=`<div class="kicker">Feuille de synthèse</div><h2>🏠 ${esc(S.name+' '+S.last)}, ton bilan de ${S.sex==='f'?'locataire':'locataire'}</h2>
  ${(()=>{const F=finalScore(),total=(S.endAt||Date.now())-S.t0,played=S.started.length,ans=S.good+S.bad,d=new Date(S.endAt||Date.now());
    return `<div class="row" style="gap:28px;align-items:stretch"><div class="verdict" style="background:#FFE9A8;text-align:center;min-width:200px"><div style="font-size:14px">🏆 SCORE FINAL</div><div class="big">${F.sc} / 100</div><div style="font-size:15px">Note indicative : <b>${F.note.toFixed(1)}</b> / 6</div></div>
    <div style="font-size:14px;font-weight:700;align-self:center">Calcul du score :<br>• bonnes réponses : ${F.parts[0]} / 60 pts<br>• garantie récupérée : ${F.parts[1]} / 25 pts<br>• appartement obtenu : ${F.parts[2]} / 15 pts</div></div>
    <h3>🗂️ Fiche de la partie</h3><table class="tbl">
    <tr><th>Élève</th><td>${esc(S.name+' '+S.last)}</td><th>Terminée le</th><td>${d.toLocaleDateString('fr-CH')} à ${d.toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'})}</td></tr>
    <tr><th>⏱️ Durée totale</th><td>${dur(total)}</td><th>↺ Parties recommencées</th><td>${RESTARTS===0?'Aucune (1re partie)':RESTARTS+' fois'}</td></tr>
    <tr><th>✔ Bonnes réponses</th><td><b>${S.good} / ${TOTAL}</b> (${Math.round(S.good/TOTAL*100)} %)</td><th>✘ Erreurs</th><td>${S.bad} (sur ${ans} épreuves jouées)</td></tr>
    <tr><th>🎯 Taux de réussite</th><td>${ans?Math.round(S.good/ans*100):0} % des épreuves jouées</td><th>🔥 Meilleure série</th><td>${S.best} bonne${S.best>1?'s':''} réponse${S.best>1?'s':''} d’affilée</td></tr>
    <tr><th>🧭 Niveaux joués</th><td>${played} / ${LEVELS.length}${played<LEVELS.length?' <b style="color:var(--ko)">('+(LEVELS.length-played)+' sauté'+(LEVELS.length-played>1?'s':'')+')</b>':''}</td><th>🔑 Appartement</th><td>${S.started.includes(2)?(S.tries===1?'obtenu du 1er coup':'obtenu au '+S.tries+'e essai'):'—'} (chances : ${Math.round(S.chance)} %)</td></tr>
    <tr><th>💃 Défi de danse</th><td>${S.extra.dance!=null?S.extra.dance+' % des pas réussis':'non joué'}</td><th>🔍 État des lieux</th><td>${S.extra.hunt4?S.extra.hunt4+' défauts trouvés':'non joué'}</td></tr>
    <tr><th>💰 Garantie récupérée</th><td>${fmt(garBack())} / ${fmt(S.gar)}</td><th>✨ Jokers utilisés</th><td>${S.used.length}</td></tr></table>`})()}
  <div class="verdict" style="background:${vc}">${fill(vt)}</div>
  <h3>📊 Résultat par niveau</h3><table class="tbl"><tr><th>Niveau</th><th>Statut</th><th style="text-align:center">✔</th><th style="text-align:center">✘</th><th style="text-align:center">⏱️</th></tr>${LEVELS.map((L,i)=>{const st=S.stats[i]||{g:0,b:0},n=L.items.length,played=S.started.includes(i);return `<tr><td>${L.emoji} ${i+1}. ${L.title}</td><td>${!played?'<b style="color:var(--ko)">Non joué</b>':(st.g+st.b<n?'Pas terminé':'Terminé')}</td><td style="text-align:center">${st.g} / ${n}</td><td style="text-align:center">${st.b}</td><td style="text-align:center">${S.lvT[i]?dur(S.lvT[i]):'—'}</td></tr>`}).join('')}</table>
  <h3>🧾 Décompte de garantie – Régie du Lac</h3><table class="tbl"><tr><th>Niv.</th><th>Retenue</th><th style="text-align:right">CHF</th></tr><tr><td></td><td>Garantie versée (+ intérêts négligés)</td><td style="text-align:right">${fmt(S.gar).replace('CHF ','')}</td></tr>${S.rets.map(r=>`<tr><td>${r[2]}</td><td>${esc(r[1])}</td><td style="text-align:right;color:var(--ko)">−${fmt(r[0]).replace('CHF ','')}</td></tr>`).join('')}<tr><th></th><th>Montant restitué</th><th style="text-align:right">${fmt(garBack()).replace('CHF ','')}</th></tr></table>
  <h3>✘ Mes erreurs (${S.errors.length})</h3>${S.errors.length?`<table class="tbl"><tr><th>Niv.</th><th>Situation</th><th>Bonne réponse / à revoir</th></tr>${S.errors.map(e=>`<tr><td>${e.lv}</td><td>${esc(e.q.length>160?e.q.slice(0,157)+'…':e.q)}</td><td>${e.sol?esc(strip(e.sol))+'<br>':''}<span class="art">${esc(e.art||'')}</span></td></tr>`).join('')}</table>`:'<p>Aucune erreur, chapeau ! 🎩</p>'}
  <h3>✨ Bonus utilisés</h3><p>${S.used.length?S.used.map(esc).join(' · '):'Aucun : tu as tout fait à la force de tes neurones !'}</p>
  <h3>📕 Mes articles du CO</h3><p>Retrouve chacun de ces articles dans <b>ton</b> Code des obligations et surligne-le : ${artNums.map(a=>`<span class="art">art. ${esc(a)}</span>`).join(' ')}</p>
  <div class="tool noprint"><h3>✉️ Envoie ton bilan à ton prof</h3><p>1. Clique sur « Copier mon bilan ». 2. Colle-le dans un e-mail à <b>sebastien.jaques@eduvaud.ch</b>.</p>
  <div class="row"><button class="btn teal" id="cp">📋 Copier mon bilan</button><a class="btn alt" id="ml" style="text-decoration:none" href="#">✉️ Ouvrir mon e-mail</a><span id="cpok" style="font-weight:800"></span></div></div>
  <div class="row noprint"><button class="btn alt" id="again">↺ Recommencer</button></div>`;
  const F=finalScore();let body=`Élève : ${S.name} ${S.last} (${S.sex==='f'?'fille':'garçon'})\nSCORE FINAL : ${F.sc}/100 (note indicative ${F.note.toFixed(1)}/6)\nDurée totale : ${dur((S.endAt||Date.now())-S.t0)} · Parties recommencées : ${RESTARTS}\nBonnes réponses : ${S.good}/${TOTAL} · Erreurs : ${S.bad} · Meilleure série : ${S.best}\nNiveaux joués : ${S.started.length}/${LEVELS.length}\nAppart obtenu au ${S.tries}e essai (chances ${Math.round(S.chance)} %)\nGarantie récupérée : ${fmt(garBack())} / ${fmt(S.gar)}\nDanse : ${S.extra.dance!=null?S.extra.dance+' %':'—'} · État des lieux : ${S.extra.hunt4||'—'}\nPar niveau : `+LEVELS.map((L,i)=>{const st=S.stats[i]||{g:0,b:0};return (i+1)+') '+st.g+'/'+L.items.length+(S.lvT[i]?' en '+dur(S.lvT[i]):'')}).join(' ; ')+`\nBonus utilisés : ${S.used.join(', ')||'aucun'}\n\nErreurs :\n`+S.errors.map(e=>`- Niv. ${e.lv} : ${e.q.slice(0,90)} → ${strip(e.sol||e.art||'')}`).join('\n');
  const mb=body.length>1700?body.slice(0,1700)+'…':body;
  $('#ml').href='mailto:sebastien.jaques@eduvaud.ch?subject='+encodeURIComponent('C’est quoi les bails ? – résultats de '+S.name+' '+S.last)+'&body='+encodeURIComponent(mb);
  $('#cp').onclick=async()=>{sfx('click');try{await navigator.clipboard.writeText(body);$('#cpok').textContent='✔ Copié ! Colle-le dans ton e-mail.'}catch(e){$('#cpok').textContent='Copie impossible : sélectionne le tableau à la main.'}};
  $('#again').onclick=()=>{sfx('click');countRestart();intro()};toView()}

function vbtn(b,label){b.insertAdjacentHTML('beforeend',`<button class="btn teal" id="val" disabled>${label||'Valider'}</button>`);return $('#val')}
const R={
mcq(it,b){const tl=it.style==='tline';const ord=tl?it.opts.map((_,i)=>i):shuffle(it.opts.map((_,i)=>i));

/* ---------- jeu de danse ---------- */
let dance=null;
function startDance(it){toView(true);const A=['←','↓','↑','→'],BPM=100,B=60/BPM,FALL=1.7,LEAD=4,BEATS=32;
  const clock=()=>AC?AC.currentTime:performance.now()/1000;ac();
  const ov=document.createElement('div');ov.className='dov';ov.innerHTML=`<div class="lanes">${A.map((a,i)=>`<div class="lane" data-l="${i}"><div class="tgt">${a}</div></div>`).join('')}</div><div class="judge" id="judge"></div>`;stage.appendChild(ov);
  stage.classList.add('dancing');
  const t0=clock()+.6, notes=[];let last=-1;
  for(let k=LEAD;k<LEAD+BEATS;k++){let l;do{l=Math.floor(Math.random()*4)}while(l===last&&Math.random()<.7);last=l;notes.push({t:t0+k*B,l});
    if(k%4===3&&k<LEAD+BEATS-1&&Math.random()<.5){let l2=(l+1+Math.floor(Math.random()*3))%4;notes.push({t:t0+(k+.5)*B,l:l2})}}
  $('#dt').textContent=notes.length;
  /* musique de la danse */
  let dg=null;if(AC){if(musGain){musGain.gain.cancelScheduledValues(AC.currentTime);musGain.gain.linearRampToValueAtTime(0,AC.currentTime+.3)}
    dg=AC.createGain();dg.gain.value=.9;dg.connect(AC.destination);const prog=[57,53,48,55];
    for(let k=0;k<LEAD+BEATS+2;k++){const t=t0+k*B,root=prog[Math.floor(k/4)%4];
      if(k<LEAD){tone(k===LEAD-1?1320:880,t,.08,'square',.05,dg);continue}
      const o=tone(120,t,.22,'sine',.3,dg,.004);if(o)o.frequency.exponentialRampToValueAtTime(45,t+.18);
      noise(t+B/2,.03,dg);noise(t,.02,dg);if(k%2)noise(t,.09,dg);
      tone(mtof(root-24),t,B*.9,'sawtooth',.03,dg,.01);tone(mtof(root-12),t+B/2,B*.4,'triangle',.06,dg,.01);
      if(k%4===0)[0,4,7].forEach(iv=>tone(mtof(root+iv),t,B*1.8,'triangle',.025,dg,.02));
      if(k%2===0)tone(mtof(root+12+[0,4,7,12][Math.floor(Math.random()*4)]),t+B/2,B*.45,'square',.015,dg,.01)}}
  let hits=0,combo=0,done=false;const judge=t=>{const j=$('#judge');if(!j)return;j.textContent=t;j.classList.remove('pop');void j.offsetWidth;j.classList.add('pop')};
  const pose=l=>{const me=stage.querySelector('.me');if(!me)return;me.classList.remove('pose0','pose1','pose2','pose3');void me.getBBox;me.classList.add('pose'+l);clearTimeout(me._pt);me._pt=setTimeout(()=>me.classList.remove('pose'+l),220)};
  const flash=(l,c)=>{const ln=ov.querySelector(`.lane[data-l="${l}"]`);if(!ln)return;ln.classList.remove('ok','ko');void ln.offsetWidth;ln.classList.add(c);setTimeout(()=>ln.classList.remove(c),200)};
  const press=l=>{if(done)return;const now=clock();let best=null;for(const n of notes){if(n.l!==l||n.j)continue;const d=Math.abs(n.t-now);if(d<.22&&(!best||d<Math.abs(best.t-now)))best=n}
    if(best){best.j=1;if(best.el)best.el.remove();hits++;combo++;$('#dh').textContent=hits;$('#dc').textContent=combo;judge(Math.abs(best.t-now)<.09?'Parfait !':'Bien !');flash(l,'ok');pose(l)}
    else{combo=0;$('#dc').textContent=0;flash(l,'ko')}};
  const key=e=>{const m={ArrowLeft:0,ArrowDown:1,ArrowUp:2,ArrowRight:3}[e.key];if(m==null)return;e.preventDefault();if(!e.repeat)press(m)};
  addEventListener('keydown',key);
  const padH=e=>{const b=e.target.closest('.pad');if(b){e.preventDefault();press(+b.dataset.l)}};card.addEventListener('pointerdown',padH);
  const loop=()=>{if(done)return;const now=clock(),lanes=ov.querySelectorAll('.lane');if(!lanes.length)return finish();const H=lanes[0].clientHeight,TY=H*.78;
    const k=Math.floor((now-t0)/B);const j=$('#judge');if(k>=0&&k<LEAD&&j){j.textContent=k<LEAD-1?String(LEAD-1-k):'GO !'}
    for(const n of notes){if(n.j)continue;const dt=n.t-now;
      if(dt<FALL&&!n.el){n.el=document.createElement('div');n.el.className='note n'+n.l;n.el.textContent=A[n.l];lanes[n.l].appendChild(n.el)}
      if(n.el)n.el.style.transform=`translateY(${TY-dt/FALL*(TY+60)}px)`;
      if(dt<-.22){n.j=1;if(n.el)n.el.remove();combo=0;$('#dc').textContent=0;judge('Raté…')}}
    if(now>notes[notes.length-1].t+.5)return finish();requestAnimationFrame(loop)};
  requestAnimationFrame(loop);
  function finish(){if(done)return;done=true;removeEventListener('keydown',key);card.removeEventListener('pointerdown',padH);stage.classList.remove('dancing');
    if(dg){dg.gain.linearRampToValueAtTime(0,AC.currentTime+.4);setTimeout(()=>{try{dg.disconnect()}catch(e){}},800)}
    if(musGain&&AC)musGain.gain.linearRampToValueAtTime(.55,AC.currentTime+1.5);
    const pct=Math.round(hits/notes.length*100);ov.remove();card.querySelectorAll('.pad').forEach(b=>b.disabled=true);
    S.extra.dance=pct;resolve(pct>=60,it,'Au moins 60 % des pas réussis (toi : '+pct+' %)','Ton score : '+pct+' % ('+hits+' pas réussis sur '+notes.length+')')}
  dance={end:()=>{done=true;removeEventListener('keydown',key);card.removeEventListener('pointerdown',padH);stage.classList.remove('dancing');ov.remove();if(dg)try{dg.disconnect()}catch(e){};if(musGain&&AC)musGain.gain.linearRampToValueAtTime(.55,AC.currentTime+1)}}}

let hunt=null;
function mark(px,py,cls,txt){const m=document.createElement('div');m.className='mk '+cls;m.style.left=px+'%';m.style.top=py+'%';m.textContent=txt||'';stage.appendChild(m);if(cls==='miss')setTimeout(()=>m.remove(),1700);return m}
function startHunt(it){toView(true);stage.classList.add('hunt');const found=new Set(),ids=Object.keys(it.targets);let left=it.time;
  const h=e=>{if(!e.target.closest('svg')||e.target.closest('[data-door],[data-go]'))return;const r=stage.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*100,py=(e.clientY-r.top)/r.height*100;const hs=e.target.closest('[data-hs]');const id=hs&&hs.dataset.hs;
    if(id&&it.targets[id]&&!found.has(id)){found.add(id);mark(px,py,'hit','✔');if(it.rooms)AH.hits.push({room:S.aptRoom,px,py});sfx('hit');$('#fc').textContent=found.size;upd();$('#fl').insertAdjacentHTML('beforeend',`<span class="on">✔ ${it.targets[id]}</span>`);if(found.size===ids.length)end()}
    else if(!(id&&found.has(id))){mark(px,py,'miss',it.penalty?'−'+it.penalty+'s':'✘');sfx('tick');if(it.penalty){left=Math.max(0,left-it.penalty);const t=$('#tm');if(t)t.textContent=left;upd();if(left<=0)end()}}};
  const upd=()=>{const x=$('#hstat');if(x&&hunt)x.textContent=hunt.stat()};const tm=setInterval(()=>{left--;const t=$('#tm');if(t){t.textContent=left;if(left<=5)t.classList.add('hot')}upd();if(left<=0)end()},1000);
  stage.addEventListener('click',h);
  function end(){if(!hunt)return;clearInterval(tm);const hx=$('#hstat');if(hx)hx.remove();stage.removeEventListener('click',h);stage.classList.remove('hunt');hunt=null;const t=$('#tm');if(t)t.classList.remove('hot');
    const miss=ids.filter(i=>!found.has(i));
    if(it.rooms){AH.missing=miss;miss.filter(i=>ROOM_OF[i]===S.aptRoom).forEach(showMissing)}else miss.forEach(showMissing);
    miss.forEach(i=>$('#fl').insertAdjacentHTML('beforeend',`<span>✘ ${it.targets[i]}${it.rooms?' — '+APT_NAME[ROOM_OF[i]]:''}</span>`));
    S.extra['hunt'+S.lv]=found.size+' / '+ids.length;
    resolve(found.size===ids.length,it,'À repérer : '+ids.map(i=>it.targets[i]+(it.rooms?' ('+APT_NAME[ROOM_OF[i]].toLowerCase()+')':'')).join(', ')+(it.rooms&&miss.length?'. Tu peux encore visiter les pièces pour voir les défauts manqués (marqués « ? »).':''))}
  hunt={end:()=>{clearInterval(tm);stage.removeEventListener('click',h);stage.classList.remove('hunt');hunt=null},stat:()=>`⏱ ${left} s · 🔍 ${found.size}/${ids.length}`};const hs=document.createElement('div');hs.className='hstat';hs.id='hstat';hs.textContent=hunt.stat();if(it.rooms)stage.appendChild(hs)}
function stopHunt(){if(hunt)hunt.end();if(dance&&dance.end){dance.end();dance=null}stage.querySelectorAll('.mk').forEach(m=>{if(!m.classList.contains('show')&&!m.classList.contains('hit'))m.remove()})}

/* ---------- CONTRÔLES ---------- */
$('#bSfx').onclick=e=>{sfxOn=!sfxOn;e.currentTarget.setAttribute('aria-pressed',sfxOn);if(sfxOn)sfx('click')};
$('#bMus').onclick=e=>{musOn=!musOn;e.currentTarget.setAttribute('aria-pressed',musOn);musOn?musStart():musStop()};
$('#bRestart').onclick=()=>{sfx('click');openModal(`<h2>↺ Recommencer ?</h2><p>Ta partie en cours sera perdue.</p><div class="row"><button class="btn" id="yes">Oui, recommencer</button><button class="btn alt" data-close>Non, continuer</button></div>`);$('#yes').onclick=()=>{countRestart();closeModal();stopHunt();intro()}};
$('#brand').onclick=()=>{};
window.addEventListener('resize',()=>{const b=stage.querySelector('.bubble');if(b&&S.lv>=0){/* repositionnement simple */}});
function setBarH(){const b=document.querySelector('.hudbar');if(b)document.documentElement.style.setProperty('--barh',b.offsetHeight+'px')}
addEventListener('resize',setBarH);addEventListener('orientationchange',()=>setTimeout(setBarH,300));
document.querySelectorAll("[data-proxy]").forEach(b=>b.addEventListener("click",()=>{const t=document.getElementById(b.dataset.proxy);t.click();if(t.hasAttribute("aria-pressed"))b.setAttribute("aria-pressed",t.getAttribute("aria-pressed"))}));
const VS=document.getElementById("vswitch");function setView(v){document.body.classList.toggle("peek",v==="i");VS.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v))}VS.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;sfx("click");setView(b.dataset.v)});const CARD=document.getElementById("card");function syncBub(){const bb=stage.querySelector(".bubble");let c=CARD.querySelector(".cbub");if(!bb){if(c)c.remove();return}if(!c){c=document.createElement("div");c.className="cbub";CARD.prepend(c)}c.innerHTML=bb.innerHTML}new MutationObserver(()=>{setView("q");syncBub()}).observe(CARD,{childList:true});new MutationObserver(syncBub).observe(stage,{childList:true});new MutationObserver(()=>{if(document.getElementById("leftfb").classList.contains("on"))setView("q")}).observe(document.getElementById("leftfb"),{attributes:true});let ty=null,tx=0;addEventListener("touchstart",e=>{if(e.target.closest(".modal,.pads,.vswitch,.powers,.hudbar")||stage.classList.contains("hunt")||stage.classList.contains("dancing")){ty=null;return}ty=e.touches[0].clientY;tx=e.touches[0].clientX},{passive:true});addEventListener("touchend",e=>{if(ty==null)return;const dy=e.changedTouches[0].clientY-ty,dx=e.changedTouches[0].clientX-tx;ty=null;if(Math.abs(dx)>50||Math.abs(dy)<70)return;const inCard=e.target.closest(".card,.leftfb");if(dy>0&&inCard&&CARD.scrollTop<=0&&!document.body.classList.contains("peek"))setView("i");else if(dy<0&&!inCard&&document.body.classList.contains("peek"))setView("q")},{passive:true});
intro();setBarH();setTimeout(setBarH,500);
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
