<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Les bails">
<meta name="theme-color" content="#F4E7CF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>C’est quoi les bails ?</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --wall:#EAD6B4; --sand:#F4E7CF; --paper:#FFFAEE; --ink:#34241B; --ink-soft:#6B5546;
  --red:#D7372A; --red-dark:#A92A20; --teal:#2B7C84; --mustard:#EDAA35; --ok:#3B9460; --ko:#C7412F;
  --line:3px solid var(--ink);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sand);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(#e6d3b0 1.2px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.3px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;
  background:var(--sand);padding:8px 0 10px;border-bottom:var(--line)}
.brand{font-family:var(--display);font-size:clamp(28px,5vw,42px);line-height:1;color:var(--red);background:none;border:0;padding:0;text-shadow:2px 2px 0 var(--ink)}
.brand span{color:var(--teal)}
#money{position:relative;display:inline-grid;padding:6px 20px 5px;border-radius:18px;background:#FFE9A8;border:var(--line);box-shadow:4px 4px 0 var(--ink)}
#money small{font-size:12px;letter-spacing:.4px;text-transform:uppercase;font-weight:800}
#moneyv{font-family:var(--display);font-size:clamp(24px,4.2vw,32px);line-height:1;font-variant-numeric:tabular-nums}
#money.low{background:#F8C9BF}
.gauge{display:block;height:10px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:4px 0 2px;min-width:170px}
.gauge i{display:block;height:100%;width:40%;background:var(--mustard);transition:width .6s cubic-bezier(.3,1.4,.5,1),background .3s}
.delta{position:absolute;top:100%;right:10px;font-family:var(--display);font-size:22px;pointer-events:none;animation:dfall 1.3s ease-out forwards;text-shadow:2px 2px 0 var(--paper);white-space:nowrap}
@keyframes dfall{from{transform:translateY(-14px) scale(1.5)}to{transform:translateY(34px);opacity:0}}
.ctrl{display:flex;gap:6px;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex-basis:100%;align-items:center}
.chip{background:var(--paper);border:var(--line);border-radius:999px;padding:3px 13px;font-weight:800;font-size:15px;
  font-variant-numeric:tabular-nums;box-shadow:3px 3px 0 var(--ink);display:flex;gap:6px;align-items:center}
.chip small{font-weight:700;color:var(--ink-soft)}
.chip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.15) rotate(-3deg)}}
.restart{border:var(--line);border-radius:999px;background:var(--red);color:#fff;font-family:var(--display);font-size:16px;padding:4px 14px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.restart:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.hstat{position:absolute;top:10px;right:10px;z-index:4;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 12px;font-family:var(--display);font-size:16px;pointer-events:none;font-variant-numeric:tabular-nums}
.roomlbl{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:4;background:var(--paper);border:var(--line);border-radius:999px;padding:3px 16px;font-family:var(--display);font-size:18px;box-shadow:3px 3px 0 var(--ink);pointer-events:none;white-space:nowrap}
.roomlbl small{font-family:var(--body);font-weight:800;font-size:12px;color:var(--ink-soft)}
.nav{position:absolute;bottom:6px;z-index:4;flex-direction:row!important;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav.l{left:8px}.nav.r{right:8px}.nav.r span{order:-1}
.nav b{width:44px;height:44px;border-radius:50%;border:var(--line);background:var(--mustard);display:grid;place-items:center;font-size:22px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s}
.nav:hover b{transform:scale(1.12)}
.nav span{background:var(--ink);color:var(--paper);font-weight:800;font-size:12px;border-radius:999px;padding:1px 8px;white-space:nowrap}
@media (max-width:100000px){.nav b{width:38px;height:38px;font-size:16px}.nav span{font-size:10px}.roomlbl{font-size:13px}}
.ico{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);padding:0;display:grid;place-items:center}
.ico svg{width:17px;height:17px}
.ico:hover{background:#FFF3D6}
.ico[aria-pressed="false"]{opacity:.45;position:relative}
.ico[aria-pressed="false"]:after{content:"";position:absolute;width:26px;height:2.5px;background:var(--ink);transform:rotate(-45deg)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.dot{width:30px;height:30px;border-radius:50%;border:var(--line);background:var(--paper);font-family:var(--display);font-size:15px;display:grid;place-items:center}
button.dot.done{cursor:not-allowed;opacity:.8}button.dot.fin{background:#FFE9A8;margin-left:6px}button.dot{padding:0;cursor:pointer;transition:transform .12s}button.dot:hover{transform:translateY(-3px) scale(1.12);background:#FFF3D6}
.dot.cur{background:var(--mustard);transform:translateY(-3px);box-shadow:0 3px 0 var(--ink)}
.dot.done{background:var(--teal);color:#fff}


/* En-tête : titre, puis jauge */
.hud{flex-direction:column;align-items:stretch;gap:10px;position:static;border-bottom:0;padding-bottom:0}
.hudbar{position:sticky;top:0;z-index:30;background:var(--sand);padding:8px 0 10px;border-bottom:var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-shadow:none}
.brand .logo{width:58px;height:58px;filter:drop-shadow(3px 3px 0 var(--ink));flex:none}
.brand .bt{display:flex;flex-direction:column;align-items:flex-start;line-height:.95}
.brand .bt small{font-family:var(--display);font-size:clamp(17px,2.6vw,22px);color:var(--teal);letter-spacing:.5px}
.brand .bt b{font-family:var(--display);font-weight:400;font-size:clamp(32px,5.4vw,48px);color:var(--red);text-shadow:2px 2px 0 var(--ink)}
.hrow2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#money{display:flex!important;align-items:center;gap:12px;flex:0 1 auto;padding:6px 16px}
#money .ml{display:flex;flex-direction:column;min-width:170px}
#money .msub{font-size:12px;font-weight:700;text-transform:none;letter-spacing:0}
#money .gauge{flex:none;width:160px;min-width:0;height:14px;margin:0}
#moneyv{white-space:nowrap}
.hrow2 .dots{margin-left:auto}
@media (max-width:100000px){#money{flex-wrap:wrap}#money .gauge{width:100%}}

/* Scène + pouvoirs */
.playrow{display:grid;grid-template-columns:1fr 70px;gap:12px;align-items:start}
.stage{position:relative;border:var(--line);border-radius:22px;overflow:hidden;background:var(--wall);box-shadow:6px 6px 0 var(--ink);scroll-margin-top:130px}
.stage svg{display:block;width:100%;height:auto}
.o{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.t{stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.bubble{position:absolute;top:4%;width:33%;background:var(--paper);border:var(--line);border-radius:16px;
  padding:8px 12px;font-weight:700;font-size:15px;line-height:1.3;box-shadow:3px 3px 0 var(--ink);
  animation:pop .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:3}
.bubble b{display:block;font-family:var(--display);font-weight:400;color:var(--teal);font-size:13px;letter-spacing:.5px}
.bubble:after{content:"";position:absolute;bottom:-13px;left:var(--tx,50%);margin-left:-9px;width:18px;height:18px;background:var(--paper);
  border-right:var(--line);border-bottom:var(--line);transform:rotate(45deg) skew(10deg,10deg)}
@keyframes pop{from{transform:scale(.6);opacity:.2}}
@media (max-width:100000px){
  .stage .bubble{font-size:11px;line-height:1.2;width:46%;padding:5px 8px;border-width:2px;border-radius:12px}
  .stage .bubble b{font-size:10px}
  .playrow{grid-template-columns:1fr}
  .powers{flex-direction:row!important;justify-content:center;flex-wrap:wrap;gap:8px}
  .powers .pw{width:46px;height:46px;font-size:20px}
  .pw[data-tip]:hover:before{display:none}
  .hud{position:static}
  .brand{font-size:26px}
  #money{padding:4px 12px}
  .card{padding:16px}
  .card h2{font-size:24px}
  .tline{grid-auto-flow:row;gap:10px}.tline:before{display:none}
  .tnode{flex-direction:row;text-align:left}
}
.playrow>*{min-width:0}
body{overflow-x:hidden}
.site .bar{flex-wrap:wrap}.site .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.powers{display:flex;flex-direction:column;gap:12px;align-items:center;padding-top:6px}
.pw{width:62px;height:62px;border-radius:50%;border:var(--line);background:var(--paper);box-shadow:3px 3px 0 var(--ink);
  font-size:27px;display:grid;place-items:center;position:relative;padding:0;transition:transform .15s}
.pw:hover:not(:disabled){transform:scale(1.08) rotate(-4deg)}
.pw.locked{background:#E4D6BD;color:var(--ink-soft);font-family:var(--display);font-size:24px;cursor:not-allowed;box-shadow:none;border-style:dashed}
.pw.used{opacity:.35;cursor:not-allowed;box-shadow:none}
.pw.used:after{content:"";position:absolute;width:64px;height:3px;background:var(--ink);transform:rotate(-45deg)}
.pw.new{animation:pwnew 1s cubic-bezier(.3,1.8,.5,1) 2}
@keyframes pwnew{40%{transform:scale(1.35) rotate(10deg);background:var(--mustard)}}
.pw .n{position:absolute;bottom:-6px;right:-6px;font-size:11px;font-weight:800;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 6px;font-family:var(--body)}
.pw[data-tip]:hover:before{content:attr(data-tip);position:absolute;right:72px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--paper);
  font-size:13px;font-family:var(--body);font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;z-index:5}

/* Animations de décor */
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.p2 .eyes{animation-delay:1.7s}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.breath{animation:breath 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes breath{50%{transform:scaleY(1.015)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
@keyframes swing{50%{transform:rotate(4deg)}}
.tail{transform-box:fill-box;transform-origin:0 100%;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(-18deg)}}
.twinkle{animation:twk 2s ease-in-out infinite}
.twinkle:nth-child(2n){animation-delay:.7s}.twinkle:nth-child(3n){animation-delay:1.3s}
@keyframes twk{50%{opacity:.2}}
.drift{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(900px)}}
.boat{animation:boat 26s linear infinite}
@keyframes boat{from{transform:translateX(0)}to{transform:translateX(360px)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spinf{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hand1{transform-box:view-box;animation:spin 3s linear infinite}
.hand2{transform-box:view-box;animation:spin 36s linear infinite}
.steam path{animation:steam 3s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-12px)}}
.blinkt{animation:blinkt 1.2s steps(2) infinite}
@keyframes blinkt{50%{opacity:.25}}
.paperout{animation:paperout 3s ease-in-out infinite}
@keyframes paperout{0%{transform:translateY(-14px);opacity:0}30%{opacity:1}70%{transform:translateY(0)}100%{transform:translateY(0);opacity:0}}
.drip{animation:drip 1.6s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.glowp{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.08}}
.prop{display:none}
.p-ping g{animation:ping 1.8s ease-out infinite}
.p-ping g:nth-child(2){animation-delay:.6s}.p-ping g:nth-child(3){animation-delay:1.2s}
@keyframes ping{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-60px) scale(1.1)}}
.p-scam{animation:alarm .5s steps(2) infinite}
@keyframes alarm{50%{opacity:.3}}
.snow circle{animation:snow 3s linear infinite}
.snow circle:nth-child(2n){animation-duration:4s;animation-delay:-1s}
.snow circle:nth-child(3n){animation-duration:3.4s;animation-delay:-2s}
@keyframes snow{from{transform:translateY(-40px)}to{transform:translateY(170px)}}
.notes text{font-family:var(--display);animation:note 2s ease-out infinite}
.notes text:nth-child(2){animation-delay:.6s}.notes text:nth-child(3){animation-delay:1.2s}.notes text:nth-child(4){animation-delay:.3s}
@keyframes note{0%{opacity:0;transform:translateY(20px)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-60px) rotate(15deg)}}
.ring{animation:ring .25s ease-in-out infinite}
@keyframes ring{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.ring,.shake2{transform-box:fill-box;transform-origin:center}
.knock{animation:knock .6s ease-in-out infinite}
@keyframes knock{30%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
.bark{font-family:var(--display);animation:bark .7s ease-out infinite}
@keyframes bark{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-24px) scale(1.2)}}
.fly{animation:flyin 2.6s ease-in-out infinite}
@keyframes flyin{0%{transform:translate(-120px,-60px) rotate(-20deg);opacity:0}30%{opacity:1}60%,100%{transform:translate(0,0) rotate(0)}}
.wh{transform-box:fill-box;transform-origin:center}
.stage[data-prop="go"] .van{animation:vango 2.6s cubic-bezier(.6,0,.9,.5) .3s forwards}
.stage[data-prop="go"] .wh{animation:spin .3s linear infinite}
@keyframes vango{15%{transform:translateX(-12px)}100%{transform:translateX(-620px)}}
.stage.yes .me{animation:jump .6s}
@keyframes jump{30%{transform:translateY(-16px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
.stage.no .me{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px) rotate(-2deg)}50%{transform:translateX(6px) rotate(2deg)}80%{transform:translateX(-3px)}}
.m{display:none}
.stage[data-mood="happy"] .m.happy,.stage[data-mood="neutral"] .m.neutral,.stage[data-mood="angry"] .m.angry{display:inline}
.stage.hunt g[id]{pointer-events:none}
.ntag{pointer-events:none;font-family:var(--display);font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;letter-spacing:.5px}
.lbl{font-family:var(--display);fill:var(--ink)}
.coin{position:absolute;left:46%;top:38%;font-family:var(--display);font-size:28px;pointer-events:none;animation:flyc 1.1s ease-out forwards;text-shadow:2px 2px 0 var(--paper);z-index:4}
@keyframes flyc{to{transform:translateY(-70px);opacity:0}}
.swapin svg{animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}}

.clue{cursor:pointer}.clue:hover{filter:brightness(1.15) drop-shadow(0 0 4px #EDAA35)}
/* Jeu de danse */
.dov{position:absolute;left:2%;top:4%;bottom:4%;width:36%;z-index:5}
.lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:rgba(46,42,58,.88);border:var(--line);border-radius:16px;padding:6px;overflow:hidden}
.lane{position:relative;border-radius:10px;background:rgba(255,255,255,.07);overflow:hidden}
.lane.ok{background:rgba(59,148,96,.45)}.lane.ko{background:rgba(199,65,47,.35)}
.tgt{position:absolute;left:50%;top:78%;width:46px;height:46px;margin-left:-23px;border:3px dashed rgba(255,255,255,.7);border-radius:12px;color:rgba(255,255,255,.7);display:grid;place-items:center;font-size:24px;font-weight:900}
.note{position:absolute;left:50%;top:0;width:46px;height:46px;margin-left:-23px;border-radius:12px;border:3px solid var(--ink);display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;will-change:transform}
.n0,.pad.p0{background:#D7372A}.n1,.pad.p1{background:#2B7C84}.n2,.pad.p2{background:#3B9460}.n3,.pad.p3{background:#EDAA35}
.judge{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--display);font-size:30px;color:#fff;text-shadow:2px 2px 0 var(--ink);pointer-events:none}
.judge.pop{animation:pop .25s}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px}
.pad{border:var(--line);border-radius:14px;font-size:28px;font-weight:900;padding:10px 0;color:#fff;box-shadow:3px 3px 0 var(--ink);touch-action:manipulation}
.pad:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.stage.dancing .me{animation:groove .6s ease-in-out infinite}
@keyframes groove{50%{transform:translateY(-6px)}}
.stage .me.pose0{animation:none;transform:translateX(-10px) rotate(-8deg)}.stage .me.pose3{animation:none;transform:translateX(10px) rotate(8deg)}
.stage .me.pose2{animation:none;transform:translateY(-22px)}.stage .me.pose1{animation:none;transform:scaleY(.9)}
.stage .me{transform-box:fill-box;transform-origin:50% 100%;transition:transform .08s}
@media (max-width:100000px){.dov{width:46%}.tgt,.note{width:30px;height:30px;margin-left:-15px;font-size:16px;border-radius:8px}.judge{font-size:18px}}

/* Chasse aux défauts sur l'image */
.stage.hunt svg{cursor:crosshair}
.stage.hunt:before{content:"🔍 Touche l'image";position:absolute;bottom:12px;left:50%;transform:translateX(-50%);pointer-events:none;z-index:4;background:var(--mustard);border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:800;font-size:14px}
.mk{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;pointer-events:none;z-index:4;display:grid;place-items:center;
  font-family:var(--display);font-size:22px;animation:pop .3s cubic-bezier(.3,1.7,.5,1)}
.mk.hit{border:4px solid var(--ok);background:rgba(59,148,96,.18);color:var(--ok)}
.mk.miss{color:var(--ko);font-size:30px;animation:pop .3s, fade 1s .6s forwards}
.mk.show{border:4px dashed var(--ko);background:rgba(199,65,47,.12)}
@keyframes fade{to{opacity:0}}

/* Fiche de jeu */
.card{background:var(--paper);border:var(--line);border-radius:22px;padding:22px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;gap:14px;scroll-margin-top:130px}
.kicker{font-family:var(--display);color:var(--teal);font-size:15px;letter-spacing:1px;text-transform:uppercase}
.card h2{font-size:30px;line-height:1.1}
.card h3{font-size:20px}
.card p{margin:0;max-width:68ch}
.ctx{background:#F6EAD2;border-left:6px solid var(--mustard);border-radius:10px;padding:10px 14px}
.q{font-weight:800;font-size:19px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:var(--line);border-radius:14px;padding:12px 14px;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.opt:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);background:#FFF3D6}
.opt:disabled{cursor:default;box-shadow:none;opacity:.7}
.opt.sel{background:var(--mustard);opacity:1}
.opt.good{background:#CBE8D3;opacity:1}.opt.bad{background:#F8C9BF;opacity:1}.opt.miss{background:#fff;outline:3px dashed var(--ok);opacity:1}
.opt.gone{visibility:hidden}
.btn{align-self:flex-start;background:var(--red);color:#fff;border:var(--line);border-radius:14px;padding:10px 22px;font-family:var(--display);font-size:20px;box-shadow:4px 4px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.alt{background:var(--paper);color:var(--ink)}
.btn.teal{background:var(--teal)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{border:var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;animation:pop .3s}
.fb.ok{background:#DDF1E2}.fb.ko{background:#FBDDD6}
.fb h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.art{font-family:var(--body);font-weight:800;font-size:13px;background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tool{border:3px dashed var(--teal);border-radius:16px;padding:12px 16px;background:#E3F1F0}
.tool h3{color:var(--teal)}
ul.keep{margin:0;padding-left:20px;display:grid;gap:6px;max-width:70ch}
.timer{font-family:var(--display);font-size:22px;background:var(--ink);color:var(--paper);border-radius:12px;padding:2px 14px;font-variant-numeric:tabular-nums}
.timer.hot{background:var(--ko);animation:bump .5s infinite}
.found{display:flex;gap:6px;flex-wrap:wrap}
.found span{border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-weight:800;font-size:14px;background:#fff}
.found span.on{background:var(--ok);color:#fff}

/* Site d'annonces fictif */
.site{border:var(--line);border-radius:16px;overflow:hidden;background:#fff}
.site .bar{background:var(--teal);color:#fff;padding:8px 14px;display:flex;gap:10px;align-items:center;font-weight:800}
.site .bar .logo{font-family:var(--display);font-size:20px}
.site .bar .url{background:rgba(255,255,255,.2);border-radius:999px;padding:1px 12px;font-size:13px;font-family:monospace}
.listings{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:12px}
.ad{border:var(--line);border-radius:14px;background:#fff;text-align:left;padding:0;overflow:hidden;box-shadow:3px 3px 0 var(--ink);position:relative;transition:transform .12s}
.ad:hover:not(:disabled){transform:translate(-2px,-2px)}
.ad svg{display:block;width:100%;height:auto;border-bottom:var(--line)}
.ad .in{padding:8px 12px;display:grid;gap:2px}
.ad .pr{font-family:var(--display);font-size:20px}
.ad .ti{font-weight:800}
.ad .me{font-size:14px;color:var(--ink-soft);font-weight:700}
.ad.sel{outline:4px solid var(--mustard);transform:rotate(-1deg)}
.ad.sel:after{content:"✔ retenue";position:absolute;top:8px;right:8px;background:var(--mustard);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-weight:800;font-size:13px}
.ad.good{background:#DDF1E2}.ad.bad{background:#FBDDD6}.ad.miss{outline:4px dashed var(--ok)}
.flagtxt{font-size:17px;line-height:2;padding:14px 16px;font-weight:600}
.seg{border:0;background:transparent;padding:2px 3px;border-radius:6px;font:inherit;font-weight:600;text-align:left;cursor:pointer;border-bottom:2px dotted var(--ink-soft)}
.seg:hover:not(:disabled){background:#FFF3D6}
.seg.flag{background:#F8C9BF;text-decoration:line-through wavy var(--ko)}
.seg.wrong{background:#E4D6BD}
.seg.missed{outline:3px dashed var(--ko)}
.seg:disabled{cursor:default}

/* Téléphone */
.phone{background:#DCE9E8;border:var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;max-width:480px}
.phone .who{font-family:var(--display);font-size:14px;color:var(--teal)}
.msg{background:#fff;border:2px solid var(--ink);border-radius:14px 14px 14px 3px;padding:7px 12px;align-self:flex-start;max-width:88%;font-weight:600;animation:pop .3s backwards}
.msg:nth-child(3){animation-delay:.3s}.msg:nth-child(4){animation-delay:.6s}.msg:nth-child(5){animation-delay:.9s}
.msg.me{align-self:flex-end;background:#CBE8D3;border-radius:14px 14px 3px 14px}

/* Documents / vignettes */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vig{background:#fff;border:var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;font-size:15px;line-height:1.3;box-shadow:3px 3px 0 var(--ink);position:relative;min-height:70px}
.vig .em{font-size:28px;display:block;line-height:1.1;margin-bottom:4px}
.vig.sel{background:var(--mustard);transform:rotate(-1.5deg)}
.vig.sel:after{content:"✔";position:absolute;top:-10px;right:8px;background:var(--red);color:#fff;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:0 8px}
.vig .why{display:block;font-weight:600;font-size:13.5px;margin-top:6px}
.vig.r-ok{background:#DDF1E2;transform:none}.vig.r-ko{background:#FBDDD6;transform:none}.vig.r-miss{background:#fff;outline:3px dashed var(--ok)}
.vig:disabled{cursor:default}
.env{border:3px dashed var(--ink-soft);border-radius:14px;padding:10px 14px;font-weight:800;display:flex;gap:10px;align-items:center;background:#FDF0CF}
.env big{font-size:30px}

/* Tri */
.srow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700}
.srow .bins{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bin{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:3px 12px;font-weight:800;font-size:14px}
.bin.on{background:var(--teal);color:#fff}
.srow .why{grid-column:1/-1;font-weight:600;font-size:14px}
.srow.good{background:#DDF1E2}.srow.bad{background:#FBDDD6}
@media (max-width:100000px){.srow{grid-template-columns:1fr}.srow .bins{justify-content:flex-start}}

/* Ordre */
.slots{display:grid;gap:8px;counter-reset:s}
.slot{border:3px dashed var(--ink-soft);border-radius:12px;padding:10px 12px 10px 46px;min-height:46px;position:relative;font-weight:700;background:transparent;text-align:left}
.slot:before{counter-increment:s;content:counter(s);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--display)}
.slot.fill{border-style:solid;border-color:var(--ink);background:#fff}
.slot.good{background:#DDF1E2}.slot.bad{background:#FBDDD6}

/* Frise / calendrier */
.tline{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative;padding-top:6px}
.tline:before{content:"";position:absolute;left:8%;right:8%;top:25px;height:6px;background:var(--ink);border-radius:3px}
.tnode{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:15px;line-height:1.25;padding:0 4px;position:relative;text-align:center}
.tnode i{width:40px;height:40px;border-radius:50%;border:var(--line);background:#fff;display:block;box-shadow:3px 3px 0 var(--ink);transition:transform .12s}
.tnode:hover:not(:disabled) i{transform:scale(1.2);background:var(--mustard)}
.tnode.good i{background:var(--ok)}.tnode.bad i{background:var(--ko)}.tnode.miss i{background:#fff;outline:3px dashed var(--ok)}
.tnode:disabled{cursor:default}

/* Vrai / faux */
.tf{display:grid;gap:8px}
.tfr{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700}
.tfr .why{grid-column:1/-1;font-weight:600;font-size:14px}
.tfr.good{background:#DDF1E2}.tfr.bad{background:#FBDDD6}

/* Saisie */
.inp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inp label{font-family:var(--display);font-size:20px}
.inp input{font:inherit;font-weight:800;font-size:20px;border:var(--line);border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink);width:200px;max-width:100%}
.inp input.co{width:120px}
.pv{border:var(--line);border-radius:12px;background:#fff;padding:10px 14px;font-family:"Caveat",cursive;font-size:24px;line-height:1.2;max-width:420px;transform:rotate(-1deg);box-shadow:3px 3px 0 var(--ink)}
.pv b{font-family:var(--body);font-size:13px;text-transform:uppercase;letter-spacing:.5px;display:block;color:var(--ink-soft)}

/* Modales */
.modal{position:fixed;inset:0;background:rgba(52,36,27,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--paper);border:var(--line);border-radius:20px;box-shadow:6px 6px 0 var(--ink);max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative}
.mbox .x{position:absolute;top:10px;right:10px}
.colist{display:grid;gap:8px}
.coit{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:#fff}
.coit b{font-family:var(--display);font-weight:400;color:var(--red);margin-right:6px}
.coit.hl{background:#FFF3D6}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:300px}
.calc .scr{grid-column:1/-1;border:var(--line);border-radius:12px;background:#fff;font-family:monospace;font-size:24px;text-align:right;padding:8px 12px;min-height:50px;overflow-x:auto;white-space:nowrap}
.calc button{border:var(--line);border-radius:12px;background:#fff;font-family:var(--display);font-size:22px;padding:8px 0;box-shadow:2px 2px 0 var(--ink)}
.calc button.op{background:#FDF0CF}.calc button.eq{background:var(--teal);color:#fff}
.mini{position:relative;height:300px;border:var(--line);border-radius:16px;background:#CFE0EC;overflow:hidden;cursor:crosshair}
.box{position:absolute;width:58px;height:50px;border:3px solid var(--ink);border-radius:6px;background:#D9A86C;padding:0;font-size:22px;display:grid;place-items:center;animation:pop .2s}
.box:before{content:"";position:absolute;left:0;right:0;top:12px;border-top:3px solid var(--ink)}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl td,.tbl th{border:2px solid var(--ink);padding:6px 10px;text-align:left;vertical-align:top}
.tbl th{background:#F6EAD2;font-family:var(--display);font-weight:400}
.verdict{border:var(--line);border-radius:16px;padding:12px 16px;font-weight:800;font-size:18px}
.big{font-family:var(--display);font-size:46px;line-height:1}
.name{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.name label{font-family:var(--display);font-size:20px}
.name input{font:inherit;font-weight:800;border:var(--line);border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink);width:220px;max-width:100%}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border:2px solid var(--ink);z-index:5;animation:conf 2.6s linear forwards}
@keyframes conf{to{transform:translateY(420px) rotate(720deg)}}

@media print{
  .hud,.playrow,.btn,.noprint{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:2px solid #000}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

  .mobtip,.rotatetip{display:none}
  .row{gap:6px}.chip{font-size:13px;padding:2px 10px}.timer{font-size:17px}
  figure{max-width:520px!important}figure figcaption{font-size:10.5px!important}

  .leftfb.on{display:block;position:fixed;left:70px;right:70px;transform:none;bottom:6px;width:auto;max-height:calc(100dvh - 120px);overflow:auto;z-index:47;animation:sheetup .35s cubic-bezier(.3,1.2,.5,1);border-radius:16px;transition:transform .35s,opacity .25s}
  body.peek .leftfb.on{transform:translateY(calc(100% + 20px));opacity:0;pointer-events:none}

  .leftfb #next{position:sticky;bottom:0;margin-top:6px;width:100%;font-size:18px;padding:9px}
  body:has(.leftfb.on) .card{display:none}
  /* défis : rien ne cache l'image */
  body:has(.stage.hunt) .card{display:none}
  body:has(.stage.hunt) .hudbar{display:none}
  body:has(.stage.dancing) .card{visibility:hidden;animation:none;transform:none}

  body:has(.stage.hunt) .powers,body:has(.stage.dancing) .powers{display:none}

  .pads{left:auto;right:10px;width:40%;padding:6px;bottom:8px}.pad{font-size:24px;padding:8px 0}
  .dov{width:34%}
}

.breath,.drift,.twinkle{animation:none!important}

<script>window.MOBILE=true;
/* ============ PERSONNAGES & DÉCORS (SVG dessinés à la main) ============ */
const INK='#34241B';
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=(n>>8&255)+amt,b=(n&255)+amt;r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function limb(pts,w,col){const d='M'+pts.map(p=>p.join(' ')).join(' L');return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+5}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`}
function person(o){
  const x=o.x, y=o.y||322, sk=o.skin||'#F1C19A', sh=o.shirt||'#2B7C84', pa=o.pants||'#3D4E6B', ha=o.hair||'#5A3A22', f=!!o.fem;
  const hy=y-142, skD=shade(sk,-30), shD=shade(sh,-40), shL=shade(sh,45), paD=shade(pa,-32), haL=shade(ha,50), haD=shade(ha,-30);
  const iris=o.iris||(f?'#7A4E2D':'#4E3A2A');
  const sw=f?21:34;
  /* ---------- cheveux ---------- */
  let back='',front='';
  if(o.style==='long'){back=`<path class="o" fill="${ha}" d="M${x-26} ${hy-2} q0-32 26-32 q26 0 26 32 q2 34 12 62 q-10 6-18 2 q-6 5-14-1 l-4-40 h-4 l-4 40 q-8 6-14 1 q-8 4-18-2 q10-28 12-62z"/><path fill="none" stroke="${haD}" stroke-width="2" d="M${x-22} ${hy+14} q-2 26-8 50 M${x+22} ${hy+14} q2 26 8 50"/>`;
    front=`<path class="o" fill="${ha}" d="M${x-25} ${hy-1} q-4-31 25-31 q28 0 25 31 q-3-10-10-15 q-12 5-26 2 q-9 0-14 13z"/><path fill="none" stroke="${haD}" stroke-width="1.8" stroke-linecap="round" d="M${x+15} ${hy-14} q-4-8-12-12 M${x-4} ${hy-12} q2-8 8-12"/><path fill="none" stroke="${haL}" stroke-width="2" stroke-linecap="round" d="M${x-12} ${hy-22} q8-6 18-4"/>`}
  else if(o.style==='bun'){back=`<circle class="o" fill="${ha}" cx="${x+2}" cy="${hy-33}" r="12"/><path fill="none" stroke="${haL}" stroke-width="2" d="M${x-5} ${hy-38} q7-5 14 0"/>`;
    front=`<path class="o" fill="${ha}" d="M${x-25} ${hy-1} q-4-31 25-31 q28 0 25 31 q-6-12-16-16 q-12 6-34 16z"/><path fill="none" stroke="${haL}" stroke-width="2" stroke-linecap="round" d="M${x+4} ${hy-23} q9 3 13 12"/>`}
  else if(o.style==='curly') front=`<path class="o" fill="${ha}" d="M${x-27} ${hy+8} q-9-16 3-25 q2-16 19-14 q9-11 23-1 q17-1 17 15 q11 11 0 27 q-5-12-14-14 q-10 9-26 3 q-10 3-22 9z"/><g fill="none" stroke="${haL}" stroke-width="2" stroke-linecap="round"><path d="M${x-14} ${hy-24} q4-4 8 0"/><path d="M${x+6} ${hy-26} q4-4 8 0"/><path d="M${x+18} ${hy-12} q4-3 6 2"/></g>`;
  else if(o.style==='bald') front=`<path class="o" fill="${ha}" d="M${x-24} ${hy+8} q-3-14 3-20 l5 14z M${x+24} ${hy+8} q3-14-3-20 l-5 14z"/><path fill="none" stroke="#fff" stroke-width="2.5" opacity=".5" stroke-linecap="round" d="M${x-10} ${hy-20} q8-5 18-2"/>`;
  else front=`<path class="o" fill="${ha}" d="M${x-25} ${hy+4} l-4-14 l8 3 l-3-16 l11 7 l3-15 l9 11 l8-12 l5 14 l10-6 l-1 14 l7 1 q-1 7-5 12 q-6-13-21-15 q-15 3-27 16z"/><path fill="none" stroke="${haL}" stroke-width="2" stroke-linecap="round" d="M${x-8} ${hy-18} l6-8 M${x+6} ${hy-17} l4-9"/>`;
  /* ---------- bas du corps ---------- */
  const legs = o.skirt
    ? `${limb([[x-8,y-40],[x-9,y-8]],9,'#5A4636')}${limb([[x+8,y-40],[x+9,y-8]],9,'#5A4636')}<path class="o" fill="${pa}" d="M${x-22} ${y-64} h44 l8 32 h-60z"/><path stroke="${paD}" stroke-width="2" d="M${x} ${y-58} v24 M${x-12} ${y-56} l-3 22 M${x+12} ${y-56} l3 22"/>`
    : f ? `<path class="o" fill="${pa}" d="M${x-22} ${y-64} H${x+22} Q${x+24} ${y-46} ${x+17} ${y-32} L${x+15} ${y-7} H${x+4} L${x+1} ${y-46} H${x-1} L${x-4} ${y-7} H${x-15} L${x-17} ${y-32} Q${x-24} ${y-46} ${x-22} ${y-64}Z"/><path fill="none" stroke="${paD}" stroke-width="2" d="M${x-12} ${y-40} l-1 30 M${x+12} ${y-40} l1 30"/>`
        : `<path class="o" fill="${pa}" d="M${x-21} ${y-62} H${x+21} L${x+20} ${y-7} H${x+3} L${x+1} ${y-46} H${x-1} L${x-3} ${y-7} H${x-20}Z"/><path fill="none" stroke="${paD}" stroke-width="2" d="M${x-12} ${y-44} v34 M${x+12} ${y-44} v34 M${x-18} ${y-56} q6 5 11 0"/>`;
  const shoes = f
    ? `<path class="o" fill="${o.skirt?INK:'#A92A20'}" d="M${x-17} ${y-9} h13 q2 0 2 4 v3 h-19 q-1-7 4-7z"/><path class="o" fill="${o.skirt?INK:'#A92A20'}" d="M${x+4} ${y-9} h13 q5 0 4 7 h-19 v-3 q0-4 2-4z"/>`
    : `<path class="o" fill="#F4F0E6" d="M${x-25} ${y-10} q0-4 6-4 h15 q3 0 3 4 v8 h-24z"/><path class="o" fill="#F4F0E6" d="M${x+1} ${y-10} q0-4 3-4 h15 q6 0 6 4 v8 h-24z"/><path stroke="${INK}" stroke-width="2.4" d="M${x-25} ${y-5} h24 M${x+1} ${y-5} h24"/><path stroke="#D7372A" stroke-width="2" d="M${x-15} ${y-12} l5-2 M${x+11} ${y-12} l5-2"/>`;
  /* ---------- buste ---------- */
  const torso = f
    ? `<path class="o" fill="${sh}" d="M${x-12} ${y-121} L${x-20} ${y-116} Q${x-24} ${y-112} ${x-22} ${y-104} Q${x-21} ${y-94} ${x-15} ${y-84} Q${x-13} ${y-77} ${x-17} ${y-70} Q${x-22} ${y-66} ${x-22} ${y-60} L${x+22} ${y-60} Q${x+22} ${y-66} ${x+17} ${y-70} Q${x+13} ${y-77} ${x+15} ${y-84} Q${x+21} ${y-94} ${x+22} ${y-104} Q${x+24} ${y-112} ${x+20} ${y-116} L${x+12} ${y-121}Z"/>
       <ellipse cx="${x-9}" cy="${y-102}" rx="8" ry="6" fill="${shL}" opacity=".3"/><ellipse cx="${x+9}" cy="${y-102}" rx="8" ry="6" fill="${shL}" opacity=".3"/>
       <path fill="none" stroke="${shD}" stroke-width="2.3" stroke-linecap="round" d="M${x-19} ${y-98} q9 9 18 0 M${x+1} ${y-98} q9 9 18 0"/>
       <path fill="none" stroke="${shD}" stroke-width="1.8" stroke-linecap="round" d="M${x-14} ${y-80} q3 3 0 7 M${x+14} ${y-80} q-3 3 0 7"/>
       <path class="t" fill="${sk}" d="M${x-10} ${y-121} q10 13 20 0z"/><path class="t" fill="none" d="M${x-12} ${y-121} q12 16 24 0"/>`
    : `<path class="o" fill="${sh}" d="M${x-12} ${y-122} L${x-30} ${y-117} Q${x-37} ${y-114} ${x-35} ${y-104} L${x-24} ${y-64} L${x-21} ${y-58} H${x+21} L${x+24} ${y-64} L${x+35} ${y-104} Q${x+37} ${y-114} ${x+30} ${y-117} L${x+12} ${y-122}Z"/>
       ${o.tie||o.plain?'':`<path class="t" fill="#F4F0E6" d="M${x-11} ${y-121} L${x-15} ${y-58} H${x+15} L${x+11} ${y-121}Z"/><path class="t" fill="${shade('#F4F0E6',-30)}" d="M${x-9} ${y-121} q9 8 18 0z"/><path fill="none" stroke="#C9C2B4" stroke-width="2" stroke-linecap="round" d="M${x-9} ${y-104} q4 3 8 1 M${x+1} ${y-103} q4 2 8-1"/>
       <path fill="none" stroke="${shD}" stroke-width="2.4" d="M${x-11} ${y-121} l-5 12 l6 4 M${x+11} ${y-121} l5 12 l-6 4"/><circle cx="${x-17}" cy="${y-90}" r="2" fill="${INK}"/><circle cx="${x-18}" cy="${y-76}" r="2" fill="${INK}"/>`}
       <path fill="none" stroke="${shD}" stroke-width="2" stroke-linecap="round" d="M${x-28} ${y-104} q3 10 6 22 M${x+28} ${y-104} q-3 10-6 22"/>`;
  const belt = o.skirt?'' : `<rect class="t" x="${x-(f?22:21)}" y="${y-66}" width="${f?44:42}" height="6" fill="#4A3324"/><rect class="t" x="${x-4}" y="${y-67}" width="8" height="8" fill="#EDAA35"/>`;
  const blazer = o.blazer ? `<path class="t" fill="#fff" d="M${x-10} ${y-121} l10 22 l10-22z"/><path class="t" fill="${shD}" d="M${x-12} ${y-121} l12 27 l-8 2 l-10-25z M${x+12} ${y-121} l-12 27 l8 2 l10-25z"/><circle cx="${x}" cy="${y-82}" r="2.5" fill="${INK}"/><circle cx="${x}" cy="${y-71}" r="2.5" fill="${INK}"/>` : '';
  const tie = o.tie ? `<path class="t" fill="#fff" d="M${x-11} ${y-122} l11 11 l11-11 l-4 11 l-7-2 l-7 2z"/><path class="t" fill="${o.tie}" d="M${x-4} ${y-112} h8 l3 30 l-7 8 l-7-8z"/>` : '';
  /* ---------- bras ---------- */
  const aw=f?9:12, hr=f?5.5:7;
  const hand=(cx,cy)=>`<circle class="o" fill="${sk}" cx="${cx}" cy="${cy}" r="${hr}"/><path stroke="${skD}" stroke-width="1.6" stroke-linecap="round" d="M${cx-2} ${cy-2} q2 3 0 5"/>`;
  const arm=(side,pts,handAt)=>{const sl=f?pts:pts.slice(0,2);let h=limb(pts,aw,f?sh:sk);if(!f)h=limb(pts,aw,sk)+limb(sl,aw+2,sh);return h+(handAt?hand(...handAt):'')};
  const L=x-sw+3, R=x+sw-3;
  let armL, armR;
  if(o.carton){armL=arm(-1,[[L,y-112],[L-6,y-92],[x-30,y-82]],null);armR=arm(1,[[R,y-112],[R+6,y-92],[x+30,y-82]],null)}
  else{armL=arm(-1,[[L,y-112],[L-7,y-86],[L-5,y-62]],o.clip?null:[L-5,y-57]);
    armR=o.wave?arm(1,[[R,y-112],[R+14,y-128],[R+16,y-150]],[R+16,y-156]):arm(1,[[R,y-112],[R+7,y-86],[R+5,y-62]],[R+5,y-57])}
  const clip = o.clip ? `<g transform="rotate(-8 ${L-10} ${y-74})"><rect class="o" x="${L-28}" y="${y-98}" width="34" height="44" rx="3" fill="#C99B6B"/><rect class="t" x="${L-16}" y="${y-102}" width="10" height="7" rx="2" fill="#9AA5B1"/><rect x="${L-23}" y="${y-90}" width="24" height="32" fill="#fff"/><path stroke="${INK}" stroke-width="1.5" d="M${L-20} ${y-84} h18 M${L-20} ${y-77} h18 M${L-20} ${y-70} h12"/></g>${hand(L-5,y-64)}` : '';
  const carton = o.carton ? `<g><rect class="o" x="${x-36}" y="${y-114}" width="72" height="56" rx="3" fill="#D9A86C"/><path class="t" fill="none" d="M${x-36} ${y-100} h72 M${x} ${y-114} v14"/><rect x="${x-14}" y="${y-92}" width="28" height="10" fill="#fff" stroke="${INK}" stroke-width="1.5"/>${hand(x-36,y-82)}${hand(x+36,y-82)}</g>` : '';
  /* ---------- tête ---------- */
  const face = f
    ? `M${x-22} ${hy-4} q0-24 22-24 q22 0 22 24 q0 16-9 25 q-7 6-13 6 q-6 0-13-6 q-9-9-9-25z`
    : `M${x-23} ${hy-4} q0-25 23-25 q23 0 23 25 q0 14-4 22 q-7 9-19 10 q-12-1-19-10 q-4-8-4-22z`;
  const eye=(ex,dir)=> f
    ? `<ellipse cx="${ex}" cy="${hy+2}" rx="5.8" ry="7.2" fill="#fff" stroke="${INK}" stroke-width="1.4"/><ellipse cx="${ex+.5}" cy="${hy+3}" rx="4.2" ry="5.6" fill="${iris}"/><circle cx="${ex+.5}" cy="${hy+3.5}" r="2.3" fill="${INK}"/><circle cx="${ex+2}" cy="${hy+.5}" r="1.5" fill="#fff"/><circle cx="${ex-1.2}" cy="${hy+6}" r=".8" fill="#fff"/><path fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" d="M${ex-6} ${hy-3} q6-7 12-1 l${dir*3} -2"/>`
    : `<ellipse cx="${ex}" cy="${hy+3}" rx="5" ry="5.6" fill="#fff" stroke="${INK}" stroke-width="1.4"/><ellipse cx="${ex+.5}" cy="${hy+3.5}" rx="3.4" ry="4.2" fill="${iris}"/><circle cx="${ex+.5}" cy="${hy+4}" r="1.9" fill="${INK}"/><circle cx="${ex+1.7}" cy="${hy+2}" r="1.2" fill="#fff"/><path fill="none" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" d="M${ex-5} ${hy-1} q5-4 10 0"/>`;
  const brows = f
    ? `<path fill="none" stroke="${haD}" stroke-width="2" stroke-linecap="round" d="M${x-15} ${hy-10} q5-4 10-1 M${x+5} ${hy-11} q5-3 10 1"/>`
    : `<path fill="none" stroke="${o.style==='bald'?'#9A948C':haD}" stroke-width="4" stroke-linecap="round" d="M${x-16} ${hy-6} l11-3 M${x+5} ${hy-9} l11 3"/>`;
  const mouth = o.me

  const lips = (f&&o.me) ? `<path fill="#D9665A" opacity=".55" d="M${x-5} ${hy+14} q5 -2 10 0 q-5 2-10 0z"/>` : '';
  const nose = f ? `<path fill="none" stroke="${skD}" stroke-width="1.8" stroke-linecap="round" d="M${x+1} ${hy+8} q2 2-1 3"/>` : `<path fill="none" stroke="${skD}" stroke-width="2" stroke-linecap="round" d="M${x+1} ${hy+3} q4 7-2 9"/>`;

/* Graphique du taux de référence (valeurs publiées par l'OFL) */
const REF=[[2011.92,2.50],[2012.42,2.25],[2013.67,2.00],[2015.42,1.75],[2017.42,1.50],[2020.17,1.25],[2023.42,1.50],[2023.92,1.75],[2025.17,1.50],[2025.67,1.25],[2026.9,1.25]];
function refChart(marks){const M=!!window.MOBILE,W=M?400:680,H=M?300:280,L=M?62:60,Rr=W-12,T=M?44:40,B=H-(M?34:30),fs=M?15:11;
  const X=y=>L+(y-2011.5)/(2027-2011.5)*(Rr-L),Y=r=>B-(r-0.75)/(2.75-0.75)*(B-T);
  let d='';REF.forEach(([y,r],i)=>{d+=(i?` H${X(y)} V${Y(r)}`:`M${X(y)} ${Y(r)}`)});
  const grid=[1,1.25,1.5,1.75,2,2.25,2.5].map(r=>`<path d="M${L} ${Y(r)} H${Rr}" stroke="#E0D6C2" stroke-width="1.5"/><text x="${L-6}" y="${Y(r)+fs*.35}" font-size="${fs}" text-anchor="end" fill="#6B5546">${r.toFixed(2)} %</text>`).join('');
  const yrs=(M?[2012,2016,2020,2024]:[2012,2014,2016,2018,2020,2022,2024,2026]).map(y=>`<text x="${X(y)}" y="${B+fs+6}" font-size="${fs}" text-anchor="middle" fill="#6B5546">${y}</text><path d="M${X(y)} ${B} v5" stroke="#6B5546"/>`).join('');
  const mk=(marks||[]).map(([y,l])=>`<path d="M${X(y)} ${T} V${B}" stroke="#D7372A" stroke-width="2" stroke-dasharray="5 4"/><rect x="${X(y)-52}" y="${T-22}" width="104" height="20" rx="10" fill="#D7372A"/><text x="${X(y)}" y="${T-7}" font-size="${M?13:11}" font-weight="800" fill="#fff" text-anchor="middle">${l}</text>`).join('');
  return `<figure style="margin:0;max-width:680px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fff;border:3px solid #34241B;border-radius:14px" role="img" aria-label="Évolution du taux d'intérêt de référence de 2011 à 2026">
  <text x="${L}" y="${M?20:16}" font-size="${M?15:13}" font-weight="800" fill="#34241B">Taux d’intérêt de référence${M?'':' (bail à loyer)'}, 2011 – 2026</text>${grid}${yrs}<path d="M${L} ${B} H${Rr}" stroke="#34241B" stroke-width="2"/>${mk}
  <path d="${d}" fill="none" stroke="#2B7C84" stroke-width="${M?3.5:4}" stroke-linejoin="round"/></svg><figcaption style="font-size:12px;color:#6B5546">Source : Office fédéral du logement (OFL), publication trimestrielle. Lis la valeur en vigueur à la date indiquée.</figcaption></figure>`}

{title:'Le dossier de candidature', scene:'desk', emoji:'📁',
 intro:'L’appartement te plaît ! Mme Rochat t’a donné le formulaire d’inscription. Il faut maintenant monter un <b>dossier béton</b>… et passer par l’<b>office des poursuites</b>.',

 {type:'tf', scene:'desk', who:'me', say:'L’assurance RC… obligatoire ou pas ?',

{title:'La signature du bail', scene:'agency', emoji:'✍️',
 intro:'Ton dossier a été retenu 🎉 ! Rendez-vous à la <b>Régie du Lac</b> pour signer le bail. Lis bien avant de signer : toutes les clauses ne sont pas forcément légales… <br><b>Nouvelle mission :</b> tu vas verser une garantie de loyer. À partir de maintenant, chaque erreur entraîne une <b>retenue</b> que la régie déduira de ta garantie à ton départ. Objectif : la <b>récupérer en entier</b> !',
 keep:['Garantie : <b>max. 3 mois de loyer</b>, sur un <b>compte bancaire bloqué au nom du locataire</b> (art. 257e CO).','Le gros entretien est à la charge du <b>bailleur</b> (art. 256 CO).','Visites du bailleur seulement si <b>nécessaires</b> et annoncées (art. 257h CO).','Bail à loyer ≠ bail commercial ≠ <b>bail à ferme</b> (chose productive, art. 275 CO).','Loyer initial abusif : contestation dans les <b>30 jours</b> après la remise des clés (art. 270 CO).'],
 power:'mini',

{title:'L’état des lieux d’entrée', scene:'empty', emoji:'📋',

 {type:'mcq', prop:'phone', who:'x', at:400, by:'📞 Mme Rochat', say:'Allô ? Le taux hypothécaire a monté : 1’300.– dès le mois prochain !',
  q:'La régie t’annonce une hausse de loyer <b>par téléphone</b>. Est-elle valable ?',
  opts:['Non : une hausse doit être notifiée sur formule officielle, motivée, au moins 10 jours avant le début du délai de résiliation ; sinon elle est nulle.','Oui, puisqu’elle est motivée par le taux hypothécaire.','Oui, si tu ne protestes pas dans les 30 jours.','Non, car une hausse du taux hypothécaire n’est jamais une bonne raison.'], a:0,
  exp:'Une hausse de loyer annoncée par téléphone est <b>nulle</b> (exercice 29.5). Il faut une <b>formule officielle</b> agréée par le canton, indiquant les <b>motifs</b>, reçue au moins <b>10 jours avant le début du délai de résiliation</b>. Et elle ne vaut que pour la <b>prochaine échéance</b>, pas « le mois prochain » !',
  art:'CO 269d'},
 {type:'num', prop:'letter', who:'me', say:'Cette fois, la formule officielle est arrivée…', unit:'CHF', ans:1297.8, tol:0.6,
  q:'Le taux hypothécaire de référence passe de 1,25 % à 1,50 % (+0,25 point = <b>+3 %</b> de loyer). Ton loyer net de <b>CHF 1’260.–</b> devient… ?',
  exp:'1’260 × 1,03 = <b>CHF 1’297.80</b>. Une hausse justifiée par celle du taux hypothécaire n’est en principe <b>pas abusive</b> (art. 269a CO). Si tu l’estimes quand même abusive, tu peux la <b>contester dans les 30 jours</b> devant l’autorité de conciliation (art. 270b CO).',
  art:'CO 269a, 270b', sol:'CHF 1’297.80'},
 {type:'mcq', prop:'letter', who:'me', say:'Oups… j’ai oublié de payer le loyer de mai.',
  q:'Le 5 juin, la régie t’écrit : « Payez dans les 30 jours, sinon nous résilierons le bail. » Si tu ne paies toujours pas ?',
  opts:['Elle peut résilier avec un délai de congé de 30 jours au moins pour la fin d’un mois.','Elle peut changer la serrure immédiatement.','Rien : il faut au moins 3 loyers impayés.','Elle peut garder tes meubles en gage.'], a:0,
  exp:'C’est la <b>demeure du locataire</b> : le bailleur fixe par écrit un délai d’au moins <b>30 jours</b> en annonçant la résiliation ; faute de paiement, il peut résilier avec un congé de <b>30 jours pour la fin d’un mois</b>. Il peut aussi te mettre en poursuite. Le droit de rétention sur les meubles ne concerne que les <b>locaux commerciaux</b>.',
  art:'CO 257d'},
 {type:'order', prop:'flood', who:'me', say:'Oh non ! Ma machine à laver a fui toute la nuit… et le voisin du dessous a de l’eau au plafond !',
  q:'💧 Dégât d’eau ! Ton parquet est inondé et l’eau a coulé chez le voisin du dessous. Remets les bons réflexes dans l’ordre (clique dans l’ordre).',
  steps:['Couper l’arrivée d’eau et limiter les dégâts (éponger, surélever les meubles)','Prévenir le voisin du dessous et la régie (ou le concierge)','Prendre des photos et noter tout ce qui est abîmé','Déclarer le sinistre à ton assurance au plus vite (en ligne ou par téléphone)','Garder les factures et suivre les instructions de l’assurance (visite d’un expert)'],
  exp:'D’abord <b>limiter les dégâts</b> (tu dois agir pour que le dommage ne s’aggrave pas), puis <b>prévenir</b>, réunir des <b>preuves</b> et <b>déclarer le sinistre</b> rapidement à ton assurance. Conseil : ne reconnais pas toi-même ta responsabilité par écrit et ne paie rien directement au voisin, laisse ton assurance gérer.',
  art:'Assurances'},
 {type:'sort', prop:'flood', who:'me', say:'Heureusement que j’ai une RC… mais qui paie quoi exactement ?',
  q:'Après le dégât d’eau, qui paie ? Classe chaque dommage.',
  bins:['RC privée','Assurance ménage','Personne : c’est pour toi'],
  items:[['Le plafond et la peinture du voisin du dessous',0,'Dommage causé à une autre personne : c’est le rôle de la RC.'],['Le parquet de ton appartement (il appartient au bailleur)',0,'Le logement loué n’est pas à toi : un dégât causé au bien du bailleur est couvert par la RC (dommages au logement loué).'],['Ton canapé et ton tapis trempés',1,'Tes propres affaires : c’est l’assurance ménage (mobilier) qui paie.'],['La franchise de CHF 200.– prévue dans ton contrat',2,'La franchise est la part du dommage qui reste toujours à ta charge.'],['La vitre du voisin cassée avec ton ballon la semaine passée',0,'Encore un dommage causé à autrui : RC.']],
  exp:'La <b>RC privée</b> (responsabilité civile) paie les dommages que tu causes <b>aux autres</b> : le voisin, mais aussi le <b>logement loué</b> qui appartient au bailleur. L’<b>assurance ménage</b> protège <b>tes propres affaires</b> (incendie, dégâts d’eau, vol). La <b>franchise</b> reste à ta charge. Sans RC, tu devrais payer toi-même les dégâts chez le voisin… parfois des milliers de francs !',
  art:'Assurances'}
 ]},
/* ---------------- NIVEAU 7 (nouveau) : LE DÉTECTIVE DU LOYER ---------------- */
{title:'Le détective du loyer', scene:'home', emoji:'🔎',
 intro:'Quelques années ont passé. Ton loyer net est toujours de <b>CHF 1’260.–</b>. Aujourd’hui, une <b>formule officielle</b> arrive : la régie veut le passer à <b>CHF 1’400.–</b>, « en raison de la hausse du taux de référence et du renchérissement ». Mène l’enquête : cette hausse est-elle justifiée ? 🔎 Les indices sont <b>cachés dans ton appartement</b> : clique sur les objets de l’image !',
 keep:['Le <b>taux d’intérêt de référence</b> est publié chaque trimestre par l’<b>OFL</b> (en quarts de pour cent).','Hausse du taux : <b>+3 %</b> de loyer par quart de point. Baisse : <b>−2,91 %</b> par quart de point.','Renchérissement : on répercute <b>40 %</b> de la variation de l’IPC (bail standard).','<b>Bail indexé</b> (durée min. 5 ans) : on répercute <b>100 %</b> de l’IPC, mais pas le taux hypothécaire.','Hausse trop élevée : contester dans les <b>30 jours</b> (art. 270b CO). Taux en baisse : demander une <b>baisse</b> par écrit (art. 270a CO).'],
 power:null,
 items:[
 {type:'mcq', prop:'letter', who:'me', say:'Où est-ce que j’ai rangé mon contrat de bail, déjà ?',
  pre:refChart(),
  q:'🔎 Quel était le taux de référence au moment où ton loyer a été fixé ? Pour connaître cette date, <b>retrouve ton contrat de bail dans la pièce</b> et clique dessus pour l’ouvrir. Lis ensuite le graphique.',
  opts:['1,25 %','1,50 %','1,75 %','2,00 %'], a:0,
  exp:'Ton bail indique que le loyer a été fixé le <b>1er juin 2020</b>. Le taux de référence est alors à <b>1,25 %</b> (depuis mars 2020). C’est ce taux qui est « intégré » dans ton loyer de 1’260.–. Toute adaptation se calcule <b>à partir de la dernière fixation du loyer</b>.',
  art:'CO 269a'},
 {type:'mcq', prop:'letter', who:'me', say:'Et on est quel jour, aujourd’hui ? Où est mon téléphone…',
  pre:refChart(),
  q:'🔎 Quel est le taux de référence en vigueur <b>aujourd’hui</b>, au moment où tu reçois la hausse ? Pour connaître la date du jour, <b>trouve ton téléphone dans la pièce</b> et clique dessus.',
  opts:['1,25 %','1,50 %','1,75 %','2,00 %'], a:2,
  exp:'Ton téléphone indique le <b>12 novembre 2024</b>. Depuis décembre 2023, le taux est à <b>1,75 %</b>. Il est donc passé de 1,25 % à 1,75 % : <b>+0,50 point</b>, soit <b>deux quarts de point</b>.',
  art:'CO 269a'},
 {type:'num', prop:'letter', who:'me', say:'Deux quarts de point… combien ça fait sur mon loyer ?', unit:'%', ans:6, tol:.01,
  q:'Pour un taux inférieur à 5 %, chaque <b>quart de point</b> de hausse permet d’augmenter le loyer de <b>3 %</b>. Avec les deux taux que tu as trouvés, de combien de % ton loyer peut-il augmenter à cause du taux ?',
  exp:'2 quarts de point × 3 % = <b>+6 %</b>. C’est la règle utilisée dans les tableaux de l’ASLOCA et des régies (ordonnance sur le bail, OBLF).',
  art:'CO 269a', sol:'+6 %'},
 {type:'num', prop:'letter', who:'me', say:'Ensuite, le renchérissement…', unit:'%', ans:2.4, tol:.05,
  q:'Entre la date de fixation de ton loyer et aujourd’hui, l’IPC est passé de <b>100,0</b> à <b>106,0</b> (valeurs arrondies pour l’exercice). Pour un bail standard, on répercute seulement <b>40 %</b> du renchérissement. De combien de % le loyer peut-il augmenter ?',
  exp:'Le renchérissement est de 6 % (100 → 106). 40 % × 6 % = <b>+2,4 %</b>. Le locataire ne paie qu’une partie de l’inflation, car le loyer couvre surtout le capital du propriétaire.',
  art:'CO 269a', sol:'+2,4 %'},
 {type:'num', prop:'letter', who:'me', say:'J’additionne tout et je calcule mon loyer maximal…', unit:'CHF', ans:1378.44, tol:1,
  q:'La régie invoque aussi la hausse des <b>frais d’entretien</b> : pour l’exercice, on admet <b>+1 %</b>. Additionne les trois hausses (taux + IPC + frais) et calcule le <b>loyer net maximal</b> admissible à partir de CHF 1’260.–.',
  exp:'6 % + 2,4 % + 1 % = <b>9,4 %</b>. 1’260 × 1,094 = <b>CHF 1’378.44</b>. C’est le maximum justifiable. Pour vérifier un cas réel, l’ASLOCA met un <b>calculateur de loyer</b> en ligne : on y entre le loyer net, la date de la dernière fixation et la prochaine échéance.',
  art:'CO 269a', sol:'CHF 1’378.44'},
 {type:'num', prop:'letter', who:'me', say:'Au fait, de combien de % la régie veut-elle augmenter mon loyer ?', unit:'%', ans:11.11, tol:.06,
  q:'La régie veut passer ton loyer net de <b>CHF 1’260.–</b> à <b>CHF 1’400.–</b>. Calcule le pourcentage de la hausse demandée (arrondi au centième).',
  exp:'(1’400 − 1’260) ÷ 1’260 × 100 = <b>+11,11 %</b>. C’est plus de 10 % : retiens bien ce chiffre pour la question suivante !',
  art:'CO 269d', sol:'+11,11 %'},
 {type:'mcq', prop:'letter', who:'me', say:'Plus de 10 %… ça change quelque chose ?',
  q:'Tu contestes la hausse de <b>11,11 %</b>. Devant l’autorité de conciliation, qui doit prouver ?',
  opts:['Le bailleur : la hausse dépasse 10 %, c’est à lui de prouver qu’elle est justifiée (inversion du fardeau de la preuve).','Toi : c’est toujours au locataire de prouver qu’une hausse est abusive.','Personne : le juge décide au hasard.','La banque qui a accordé l’hypothèque.'], a:0,
  exp:'Si la hausse est de <b>plus de 10 %</b> et que le locataire la conteste, c’est au <b>propriétaire de prouver</b> qu’elle est justifiée : on parle d’<b>inversion du fardeau de la preuve</b>. Pour une hausse de <b>moins de 10 %</b>, c’est au <b>locataire</b> de prouver qu’elle est abusive (seulement dans le cadre de la procédure).',
  art:'CO 270b'},
 {type:'mcq', prop:'letter', who:'me', say:'La régie demande 1’400.–… et moi j’arrive à 1’378.44 !',
  q:'Que fais-tu ?',
  opts:['La hausse dépasse ce qui est justifié : je la conteste devant l’autorité de conciliation dans les 30 jours.','Je paie 1’400.– : une formule officielle ne peut pas être contestée.','Je paie seulement 1’378.44 dès le mois prochain, sans rien dire.','Je résilie mon bail immédiatement.'], a:0,
  exp:'La hausse est <b>valable dans la forme</b> (formule officielle, motivée, à temps), mais son <b>montant</b> paraît trop élevé de plus de 20.– par mois. Tu peux la <b>contester dans les 30 jours</b> devant l’autorité de conciliation. Ne réduis jamais toi-même le montant payé : continue à payer selon le bail jusqu’à la décision.',
  art:'CO 270b'},
 {type:'mcq', prop:'', who:'me', say:'Septembre 2025 : le taux redescend à 1,25 % !',
  pre:refChart([[2025.67,'sept. 2025']]),
  q:'Le taux de référence est redescendu de 1,75 % à <b>1,25 %</b>. Que peux-tu faire ?',
  opts:['Demander par écrit une baisse de loyer pour la prochaine échéance ; si la régie refuse, saisir l’autorité de conciliation.','Rien : le loyer ne peut qu’augmenter.','Payer automatiquement moins dès le mois suivant.','Attendre que la régie baisse d’elle-même le loyer.'], a:0,
  exp:'La baisse n’est <b>pas automatique</b> : c’est au locataire de la <b>demander par écrit</b> au bailleur pour le prochain terme de résiliation. Si le bailleur refuse ou ne répond pas dans les 30 jours, le locataire peut saisir l’<b>autorité de conciliation</b>.',
  art:'CO 270a'},
 {type:'mcq', prop:'', who:'me', say:'Mais pourquoi le taux a-t-il baissé ?',
  q:'Pourquoi le taux de référence est-il redescendu en 2025 ?',
  opts:['La BNS a baissé son taux directeur, les banques ont baissé leurs taux hypothécaires, et le taux de référence (leur moyenne) a suivi avec un peu de retard.','Le Conseil fédéral fixe librement le taux de référence chaque année.','Les régies se sont mises d’accord pour baisser les loyers.','Le taux de référence suit le prix de l’essence.'], a:0,
  exp:'Le taux de référence est calculé à partir du <b>taux hypothécaire moyen des banques</b>. Quand la <b>BNS</b> baisse son taux directeur, les taux hypothécaires baissent… et le taux de référence suit <b>avec un décalage</b>, puisqu’il s’agit d’une moyenne de tous les prêts en cours. Il est publié par l’OFL chaque trimestre.',
  art:'Taux de référence (OFL)'},
 {type:'num', prop:'', who:'me', say:'Combien je peux récupérer ?', unit:'%', ans:5.82, tol:.02,
  q:'En cas de baisse, chaque quart de point donne droit à une baisse de <b>2,91 %</b> du loyer. Le taux passe de 1,75 % à 1,25 %. De combien de % peux-tu demander que ton loyer baisse ?',
  exp:'2 quarts de point × 2,91 % = <b>−5,82 %</b>. Pourquoi 2,91 % et pas 3 % ? Parce qu’une baisse de 2,91 % « annule » exactement une hausse de 3 % (1,03 × 0,9709 ≈ 1).',
  art:'CO 270a', sol:'−5,82 %'},
 {type:'mcq', prop:'', who:'me', say:'Et si j’avais signé un bail indexé ?',
  q:'Avec un <b>bail indexé</b> (conclu pour au moins 5 ans), l’IPC passe de 100 à 104. De combien le loyer peut-il être adapté ?',
  opts:['+4 % : on répercute 100 % de l’IPC (mais pas le taux hypothécaire).','+1,6 % : 40 % de l’IPC, comme un bail standard.','+4 % + 3 % par quart de point du taux hypothécaire.','0 % : un bail indexé ne change jamais.'], a:0,
  exp:'Dans un <b>bail indexé</b>, le loyer suit <b>100 %</b> de l’IPC… et rien d’autre : le taux hypothécaire et les frais ne jouent aucun rôle. Il faut une durée d’au moins <b>5 ans</b>. Avec l’inflation, ce loyer augmente presque chaque année.',
  art:'CO 269b'}
 ]},
/* ---------------- NIVEAU 7 ---------------- */
{title:'Le départ', scene:'move', emoji:'📦',
 intro:'Quelques années plus tard… Nouveau job à Genève ! Il faut <b>résilier ton bail</b>, organiser ton départ et récupérer ta garantie. Dernière ligne droite !',
 keep:['Habitation : congé <b>par écrit</b>, 3 mois pour la fin d’un trimestre de bail (art. 266c CO) ; chambre meublée : 2 semaines pour la fin d’un mois (art. 266e CO).','Logement familial : la résiliation est signée par les <b>deux époux</b> (art. 266m CO).','Départ anticipé : présenter un <b>locataire de remplacement solvable</b> (art. 264 CO).','Congé de représailles = <b>abusif</b> (art. 271a CO) ; prolongation possible jusqu’à <b>4 ans</b> (art. 272b CO).','Usure normale ≠ dégâts : tu ne paies que les dégâts (art. 267 CO).'],
 power:null,
 items:[
 {type:'mcq', style:'tline', who:'me', say:'Ma lettre de résiliation arrive à la régie le 10 février.',
  q:'Ton bail a commencé un 1er janvier ; délai de congé : 3 mois pour la fin d’un trimestre de bail. Ta résiliation arrive le <b>10 février</b>. Quand peux-tu partir au plus tôt ?',
  opts:['31 mars','10 mai','30 juin','30 septembre'], a:2,
  exp:'10 février + 3 mois = 10 mai. Les fins de trimestre de bail sont le 31 mars, le 30 juin, le 30 septembre et le 31 décembre : la prochaine possible est le <b>30 juin</b> (exercice 29.15). Les parties peuvent prévoir un délai plus long ou d’autres termes.',
  art:'CO 266c'},
 {type:'mcq', who:'me', say:'Entre-temps, je me suis marié·e…',
  q:'Tu vis avec ton conjoint ou ta conjointe dans l’appartement (logement familial). Comment résilier ?',
  opts:['Par écrit, avec la signature des deux époux.','Par écrit, seulement avec la signature du titulaire du bail.','Un SMS à la gérante suffit.','Par téléphone, puis confirmation orale.'], a:0,
  exp:'Le congé d’un bail d’habitation doit être donné <b>par écrit</b> (le bailleur, lui, doit en plus utiliser une <b>formule officielle</b>). Pour un <b>logement familial</b>, un époux ne peut résilier qu’avec le <b>consentement exprès</b> de son conjoint : faites signer les deux (exercice 29.10).',
  art:'CO 266l, 266m'},
 {type:'mcq', who:'me', say:'Mais mon nouveau job commence le 1er avril…',
  q:'Tu dois partir le 31 mars au lieu du 30 juin. Comment éviter de payer 3 mois de loyer pour rien ?',
  opts:['Présenter un locataire de remplacement solvable, prêt à reprendre le bail aux mêmes conditions.','Arrêter de payer dès ton départ.','Laisser les clés dans la boîte aux lettres.','Demander à la régie de se payer avec la garantie.'], a:0,
  exp:'Le locataire qui veut partir sans respecter les délais est libéré s’il présente un <b>nouveau locataire solvable</b>, que le bailleur ne peut raisonnablement refuser, et qui est prêt à reprendre le bail <b>aux mêmes conditions</b>. Sinon, il reste tenu de payer jusqu’à l’échéance.',
  art:'CO 264'},
 {type:'mcq', prop:'letter', who:'me', say:'Ma voisine Mme Diaz a reçu son congé… juste après avoir demandé une réparation !',
  q:'Mme Diaz a exigé la réparation de sa fenêtre. Deux semaines plus tard, elle reçoit son congé. Que peut-elle faire ?',
  opts:['Contester ce congé de représailles, abusif, devant l’autorité de conciliation dans les 30 jours.','Rien : le bailleur résilie quand il veut.','Elle doit partir dans les 30 jours.','Elle doit payer elle-même la fenêtre pour annuler le congé.'], a:0,
  exp:'Un congé donné parce que le locataire a fait valoir des prétentions découlant du bail est un <b>congé de représailles</b> : il est <b>annulable</b>. Autres congés abusifs : moyen de pression pour une hausse, « congé-vente », changement de situation familiale, congé pendant une procédure. Le délai pour contester est de <b>30 jours</b> dès réception.',
  art:'CO 271a, 273'},
 {type:'mcq', who:'me', say:'Et la famille du 3e, avec ses 3 enfants ?',
  q:'Une famille reçoit un congé valable, mais ne trouve rien à cause de la pénurie de logements. Que prévoit la loi ?',
  opts:['Elle peut demander une prolongation du bail à l’autorité de conciliation, au maximum 4 ans au total.','Elle peut demander une prolongation de 6 ans au maximum.','Aucune possibilité : elle doit partir.','Le bail est prolongé automatiquement tant qu’elle ne trouve rien.'], a:0,
  exp:'Si le congé a des <b>conséquences pénibles</b> (impossible de trouver un logement) et qu’aucun intérêt primordial du bailleur n’est lésé, le locataire peut demander une <b>prolongation</b>. Pour une habitation : <b>4 ans maximum</b>, en une ou deux fois ; 6 ans pour des locaux commerciaux (exercice 29.16).',
  art:'CO 272, 272b'},
 {type:'sort', scene:'empty', who:'g', say:'État des lieux de sortie : on compare avec celui d’entrée…',
  q:'Après 9 ans dans l’appartement, qu’est-ce qui est <b>à ta charge</b> ? (💡 la tabelle d’usure peut t’aider)',
  bins:['À ta charge','Pas à ta charge'],
  items:[['Trou dans la porte (coup de pied)',0,'Dégât, pas de l’usure.'],['Sangles de store usées après 9 ans (durée de vie : 8 ans)',1,'Usure normale : leur durée de vie est dépassée.'],['Murs peints en rose sans autorisation',0,'Remise en état (CO 260a).'],['Rayures du parquet déjà notées à l’entrée',1,'Elles figurent dans l’état des lieux d’entrée !'],['Peinture des murs un peu jaunie après 9 ans',1,'Usure normale (durée de vie ~8 ans).']],
  exp:'Tu dois restituer la chose dans l’état qui résulte d’un <b>usage conforme</b> au contrat : l’<b>usure normale</b> n’est pas à ta charge (tabelle paritaire des durées de vie), les <b>dégâts</b> oui. Et ce qui figurait déjà dans l’état des lieux d’entrée ne peut pas t’être reproché.',
  art:'CO 267'},
 {type:'art', scene:'empty', who:'me', say:'Dernier défi CO !',
  q:'📕 Défi CO : quel article oblige le locataire à <b>restituer la chose</b> dans l’état qui résulte d’un usage conforme au contrat ?',
  ans:['267'], exp:'<b>Art. 267 CO</b> : à la fin du bail, le locataire doit restituer la chose dans l’état qui résulte d’un usage conforme au contrat.', art:'CO 267'},
 {type:'mcq', prop:'go', who:'me', say:'Et ma garantie de 3’780.– ?',
  q:'Quand récupères-tu ta garantie (plus les intérêts) ?',
  opts:['Avec l’accord des deux parties après l’état des lieux de sortie, ou si le bailleur n’a fait valoir aucune prétention dans l’année qui suit la fin du bail.','Jamais : la garantie appartient au bailleur.','Dès la signature du bail.','Seulement après 5 ans.'], a:0,
  exp:'La banque ne restitue la garantie qu’avec l’<b>accord des deux parties</b> (ou sur décision de justice). Si, <b>un an</b> après la fin du bail, le bailleur n’a fait valoir aucune prétention contre toi (poursuite, action en justice), tu peux exiger qu’elle te soit rendue.',
  art:'CO 257e'}
 ]}
];

/* Deuxième chance après un dossier refusé : questions NOUVELLES (on ne rejoue jamais la même question) */
const SECOND={title:'Deuxième chance : un nouveau dossier', scene:'desk', emoji:'🍀', keep:[], power:null,
 intro:'Mme Rochat accepte d’étudier un nouveau dossier pour le 2½ pièces du 3e étage. Cette fois, pas de faux pas : il te faut au moins <b>60 %</b> de chances à la fin !',
 items:[
 {type:'mcq', who:'me', say:'Mon extrait des poursuites date de l’an dernier… ça passe ?',
  q:'Pour un dossier de location, l’extrait de l’office des poursuites doit dater de…',
  opts:['moins de 3 mois','moins d’un an','peu importe la date','moins de 5 ans'], a:0,
  exp:'Les régies veulent un extrait <b>récent, de moins de 3 mois</b> : ta situation financière doit être à jour. Un extrait trop vieux, et ton dossier part en bas de la pile.',

  o.connect(g);g.connect(dest||a.destination);o.start(t0);o.stop(t0+dur+.05);return o}

/* Bruit de porte synthétisé échantillon par échantillon : déclic de poignée, grincement du bois (train d'impulsions filtré), souffle et léger choc */
function doorBuf(a){if(DOORBUF)return DOORBUF;const sr=a.sampleRate,N=Math.floor(sr*1.25),out=new Float32Array(N);
  const bp=(f,q)=>{const w=2*Math.PI*f/sr,al=Math.sin(w)/(2*q),a0=1+al;return{b0:al/a0,b2:-al/a0,a1:-2*Math.cos(w)/a0,a2:(1-al)/a0,x1:0,x2:0,y1:0,y2:0}};
  const run=(F,x)=>{const y=F.b0*x+F.b2*F.x2-F.a1*F.y1-F.a2*F.y2;F.x2=F.x1;F.x1=x;F.y2=F.y1;F.y1=y;return y};
  /* 1. poignée : deux déclics métalliques */
  [[0,1],[.07,.8]].forEach(([t0,amp])=>{const i0=Math.floor(t0*sr);for(let i=0;i<sr*.05;i++){const tt=i/sr,e=Math.exp(-tt*120);if(i0+i<N)out[i0+i]+=amp*e*(.6*(Math.random()*2-1)*Math.exp(-tt*400)+.35*Math.sin(2*Math.PI*2600*tt)+.2*Math.sin(2*Math.PI*4100*tt))}});
  /* 2. grincement : impulsions irrégulières (frottement bois/charnière) passées dans des résonateurs */
  const R=[bp(480,18),bp(950,22),bp(1650,25),bp(2700,20)],gains=[.9,1,.7,.35];let next=Math.floor(.16*sr);const cs=Math.floor(.16*sr),ce=Math.floor(.95*sr);
  for(let i=cs;i<ce;i++){const tt=(i-cs)/(ce-cs);let x=0;
    if(i>=next){const env=Math.sin(Math.PI*tt)**.6;x=env*(.7+.3*Math.random());const rate=38+30*Math.sin(tt*Math.PI*2.3)+18*Math.sin(tt*Math.PI*7.1)+Math.random()*6;next=i+Math.max(1,Math.floor(sr/rate))}
    let y=0;for(let k=0;k<4;k++)y+=gains[k]*run(R[k],x);out[i]+=y*3.2}
  /* 3. souffle d'air de la porte qui pivote */
  const lp={y:0};for(let i=Math.floor(.2*sr);i<Math.floor(1.05*sr);i++){const tt=(i/sr-.2)/.85;lp.y+=.02*((Math.random()*2-1)-lp.y);out[i]+=lp.y*1.4*Math.sin(Math.PI*tt)}

  const i4=Math.floor(1.0*sr);for(let i=0;i<sr*.2&&i4+i<N;i++){const tt=i/sr;out[i4+i]+=.35*Math.exp(-tt*22)*Math.sin(2*Math.PI*(70-80*tt)*tt)+.1*Math.exp(-tt*60)*(Math.random()*2-1)}

  const s=a.createBufferSource();s.buffer=longNoise;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=a.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.01,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);s.stop(t+dur+.05)}

  if(k==='level')[523.3,659.3,784,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*.11,.45,'triangle',.14));
  if(k==='hit')tone(1250,t,.15,'sine',.14);
  if(k==='tick')tone(1600,t,.03,'square',.03);
  if(k==='door'){playDoor(a,t)}
  if(k==='paper'){playPaper(a,t)}

}

};
let T=THEMES.room, musKey='room';
const mtof=m=>440*Math.pow(2,(m-69)/12), beat=()=>60/T.bpm/2;
function newMusGain(){const a=AC;const g=a.createGain();g.gain.setValueAtTime(0,a.currentTime);g.gain.linearRampToValueAtTime(.55,a.currentTime+1.8);
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=T.cut;g.connect(lp);lp.connect(a.destination);return g}
function musStart(){const a=ac();if(!a||musTimer||!musOn)return;musKey=S.scene||'room';T=THEMES[musKey]||THEMES.room;musGain=newMusGain();nextT=a.currentTime+.15;step=0;musTimer=setInterval(sched,90)}
function musSwitch(k){if(!THEMES[k]||k===musKey)return;musKey=k;T=THEMES[k];if(!musTimer||!musGain||!AC)return;const old=musGain;old.gain.cancelScheduledValues(AC.currentTime);old.gain.setValueAtTime(old.gain.value,AC.currentTime);old.gain.linearRampToValueAtTime(0,AC.currentTime+1);
  setTimeout(()=>{try{old.disconnect()}catch(e){}},1500);musGain=newMusGain();step=0;nextT=AC.currentTime+.25}
function musStop(){if(musTimer){clearInterval(musTimer);musTimer=null}if(musGain&&AC){const g=musGain;g.gain.linearRampToValueAtTime(0,AC.currentTime+.4);setTimeout(()=>{try{g.disconnect()}catch(e){}},600);musGain=null}}
function sched(){while(AC&&musGain&&nextT<AC.currentTime+.4){const B=beat();const sw=T.swing&&step%2?B*.18:0;playStep(step,nextT+sw);nextT+=B;step++}}
function playStep(s,t){const B=beat(),bar=Math.floor(s/8)%4,pos=s%8,ch=T.ch[bar],G=musGain;
  if(T.stac){if(pos%2===0)ch.forEach(m=>tone(mtof(m),t,B*.7,T.pad,.012,G,.01))}
  else if(T.pluck){if(pos===0||pos===3||pos===6)ch.forEach((m,i)=>tone(mtof(m+12),t+i*.04,B*2.2,T.pad,.03,G,.005))}
  else if(T.bossa){if([0,3,5].includes(pos))ch.forEach(m=>tone(mtof(m),t,B*1.4,T.pad,.03,G,.01))}
  else if(pos===0)ch.forEach(m=>tone(mtof(m),t,B*7.6,T.pad,T.pad==='sawtooth'?.012:.028,G,.3));
  if(pos===0)tone(mtof(ch[0]-12),t,B*3.5,'sine',.12,G,.02);
  if(pos===4)tone(mtof((T.bossa?ch[2]:ch[0])-12),t,B*3,'sine',.09,G,.02);
  if(T.pulse&&pos%2===1)tone(mtof(ch[0]-12),t,B*.5,'sine',.07,G,.01);
  if(pos%2===1||pos===2||pos===6){if(Math.random()<T.mel)tone(mtof(ch[Math.floor(Math.random()*4)]+T.oct),t,B*(T.stac?.8:1.6),T.lead,T.lead==='square'?.018:.045,G,.02)}
  if(T.hat)noise(t,pos%2?.012:.025,G);
  if(T.kick.includes(pos)){const o=tone(110,t,.25,'sine',.18,G,.005);if(o)o.frequency.exponentialRampToValueAtTime(45,t+.2)}
  if(T.snare.includes(pos))noise(t,.05,G);
}

  <div class="name"><span style="font-family:var(--display);font-size:20px">Je suis :</span><button type="button" class="bin sexb" data-sex="f" style="font-size:17px;padding:6px 16px">👧 une fille</button><button type="button" class="bin sexb" data-sex="m" style="font-size:17px;padding:6px 16px">👦 un garçon</button></div>

  const nm=$('#nm'),ln=$('#ln');

function levelIntro(lv){clearLeft();lvClock();if(!S.t0)S.t0=Date.now();S.lv=lv;S.it=0;if(!S.started.includes(lv))S.started.push(lv);if(lv>=3)S.phase=2;hud();const L=LEVELS[lv];S.scene=null;setScene(L.scene);setProp('');mood('happy');renderPowers();

const REACT_OK=['Yes ! 😄','Bien vu !','Trop fort !','Je gère 😎','Facile !'], REACT_KO=['Aïe… 😬','Oups !','Mince…','Ça va me coûter cher…'];
function resolve(ok,it,solText,note){if(S.answered)return;S.answered=true;stopHunt();
  const key=S.lv+'-'+S.it, ret=RET[key]||[150,'Frais divers'];let head;
  const st=S.stats[S.lv]||(S.stats[S.lv]={g:0,b:0});if(ok)st.g++;else st.b++;if(ok){S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;
  if(ok){S.good++;sfx('good');mood('happy');flash('yes')}else{S.bad++;sfx('bad');mood('angry');flash('no');S.errors.push({lv:S.lv+1,q:strip(fill(it.q)),sol:solText||it.sol||'',art:it.art})}
  if(S.phase===1){const d=ok?8:-10;S.chance=Math.max(0,Math.min(100,S.chance+d));fx(ok,(d>0?'+':'−')+Math.abs(d)+' %',ok?'Dossier ↑':'Dossier ↓');head=ok?'✔ Bien joué ! Chances +8 %':'✘ Raté… Chances −10 %'}
  else{if(key==='3-1')S.garShown=true;if(!ok)S.rets.push([ret[0],ret[1],S.lv+1]);fx(ok,ok?'✔':'−'+ret[0],ok?'Garantie intacte ✔':'Retenue −'+ret[0]+' CHF');head=ok?'✔ Bien joué ! Aucune retenue sur ta garantie':'✘ Raté… Retenue de CHF '+ret[0]+'.– : '+ret[1]}
  if(it.art&&!S.arts.includes(it.art))S.arts.push(it.art);
  bubble('me',(ok?REACT_OK:REACT_KO)[Math.floor(Math.random()*(ok?5:4))],{});
  $('#fbz').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><h3>${head} ${it.art?`<span class="art">${it.art}</span>`:''}</h3>${note?`<p><b>${note}</b></p>`:''}${!ok&&solText?`<p><b>Bonne réponse :</b> ${solText}</p>`:''}<p>${fill(it.exp)}</p></div><button class="btn" id="next">Suivant →</button>`;
  const nx=$('#next');nx.onclick=()=>{sfx('click');next()};if(landM()){const lf=$('#leftfb');if(lf){lf.appendChild($('#fbz'));lf.classList.add('on');lf.scrollTop=0}}hud();setTimeout(()=>nx.scrollIntoView({behavior:'auto',block:'nearest'}),150)}
function next(){S.it++;if(S.it>=curL().items.length)levelEnd();else showItem()}
function levelEnd(){clearLeft();const L=LEVELS[S.lv];if(S.lv===2&&S.chance<60){if(!S.retry)return refused();S.tries=3;S.lucky=1}sfx('level');mood('happy');setProp('');confetti();
  let pw='';if(L.power&&!S.unlocked.includes(L.power)){S.unlocked.push(L.power);S.newPw=L.power;const P=POWERS[L.power];pw=`<div class="tool"><h3>${P.e} Pouvoir débloqué : ${P.n}</h3><p>${P.d} Il t’attend dans les bulles à droite de l’image.</p></div>`}

  const nx=nextUnplayed(),last=nx===null;
  const deci=S.lv===2&&S.lucky?`<div class="fb ok"><h3>📞 Coup de chance : un candidat s’est désisté !</h3><p>Ton dossier n’était pas le meilleur (${Math.round(S.chance)} %), mais l’appartement est finalement pour toi. Ouf ! La prochaine fois, soigne ton dossier dès le départ.</p></div>`:S.lv===2?`<div class="fb ok"><h3>📞 La régie t’appelle : ton dossier est retenu ! 🎉</h3><p>Avec <b>${Math.round(S.chance)} %</b> de chances, tu passes devant les 4 autres candidats${S.tries>1?' (au '+S.tries+'e essai)':' du premier coup'}. Prochaine étape : signer le bail… et verser ta garantie, que tu devras <b>récupérer en entier</b> à la fin !</p></div>`:'';
  card.innerHTML=`<div class="kicker">Niveau ${S.lv+1} terminé</div><h2>${L.emoji} Bravo, ${esc(S.name)} !</h2>${deci}<p>${S.phase===1?'Chances d’obtenir l’appart : <b>'+Math.round(S.chance)+' %</b>':'Garantie à récupérer : <b>'+fmt(Math.max(0,S.gar-S.rets.reduce((a,x)=>a+x[0],0)))+'</b>'} · ✔ ${S.good} · ✘ ${S.bad}</p>

function refused(){clearLeft();sfx('bad');mood('angry');setScene('desk');setProp('');bubble('me','Noooon… un autre candidat a eu l’appart ! 😩',{});

/* ---------- SYNTHÈSE ---------- */
function finalScore(){const g=S.good/TOTAL,gar=garBack()/S.gar,app=S.started.includes(2)||S.phase===2?(S.tries===1?1:S.tries===2?.6:.3):0;const sc=Math.round(60*g+25*gar+15*app);return{sc,note:Math.round((1+5*sc/100)*2)/2,parts:[Math.round(60*g),Math.round(25*gar),Math.round(15*app)]}}
function garBack(){return Math.max(0,S.gar-S.rets.reduce((a,x)=>a+x[0],0))}
function verdict(){const m=garBack();if(m>=3500)return['#CBE8D3','🏆 Locataire modèle ! Tu récupères (presque) toute ta garantie : aucune régie ne pourra te piéger.'];
  if(m>=2800)return['#DDF1E2','👍 Bon·ne locataire ! Quelques retenues, mais tu récupères l’essentiel de ta garantie.'];
  if(m>=1800)return['#FDF0CF','🙂 Peut mieux faire : les retenues t’ont coûté cher. Revois les points « À retenir » et les articles ci-dessous.'];
  return['#FBDDD6','⚠️ Aïe ! La régie a gardé une grosse partie de ta garantie. Rejoue en t’aidant du CO !']}
function finale(){clearLeft();lvClock();S.endAt=S.endAt||Date.now();S.over=true;S.lv=LEVELS.length;hud();S.scene=null;setScene('home');setProp('party');mood(garBack()>=2800?'happy':'angry');confetti();setTimeout(confetti,1500);
